<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBT Exam Prep — 3rd Ed. TCO</title>
<meta name="theme-color" content="#0f3d3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2528;--mute:#5d6a6e;--line:#e3dfd6;--brand:#0f3d3e;--brand2:#1f6f6b;--acc:#e0913a;--ok:#2e7d4f;--bad:#b33a3a;--okbg:#e7f4ec;--badbg:#fbeaea;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121718;--card:#1b2224;--ink:#e9eeee;--mute:#9aa8aa;--line:#2b3436;--brand:#7fd1c7;--brand2:#5fb3aa;--okbg:#17322a;--badbg:#3a1e1e}}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--brand);color:#fff;padding:14px 18px calc(14px);position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){header{background:#0c2a2b}}
header h1{margin:0;font-size:18px;letter-spacing:.2px}header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
main{max-width:820px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav a{flex:1;text-align:center;color:var(--mute);text-decoration:none;font-size:11px;padding:4px 0;border-radius:10px}
nav a b{display:block;font-size:20px;line-height:1.2}nav a.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
h2{font-size:21px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 8px}
.btn{display:inline-block;border:0;border-radius:11px;padding:11px 16px;font:600 15px system-ui;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
@media (prefers-color-scheme:dark){.btn{color:#0c2a2b}}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}.btn.sm{padding:7px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:12.5px;color:var(--mute)}
.muted{color:var(--mute);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand2)}
.dom{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.dom:last-child{border:0}
.tag{display:inline-block;font:700 12px system-ui;background:var(--brand);color:#fff;border-radius:7px;padding:2px 7px}
@media (prefers-color-scheme:dark){.tag{color:#0c2a2b}}
.q{font-size:17px;font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 9px;font:15.5px/1.4 system-ui;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 10%,transparent)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .l{font-weight:700;margin-right:8px;color:var(--mute)}
.exp{border-left:4px solid var(--brand2);background:var(--bg);padding:10px 12px;border-radius:8px;font-size:14.5px;margin-top:6px}
.timer{font:700 16px ui-monospace,monospace;background:var(--acc);color:#fff;border-radius:9px;padding:4px 10px}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;cursor:pointer}
.qnav button.a{background:var(--brand2);color:#fff;border-color:var(--brand2)}.qnav button.f{outline:2px solid var(--acc)}.qnav button.cur{outline:2px solid var(--ink)}
.flash{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:600;cursor:pointer;user-select:none;padding:24px}
.flash.back{font-size:17px;font-weight:500;background:color-mix(in srgb,var(--brand2) 9%,var(--card))}
.chk{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.chk.done span{color:var(--mute);text-decoration:line-through}
.cs h3{color:var(--brand)}.cs ul{padding-left:20px;margin:6px 0}.cs li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
details summary{cursor:pointer;font-weight:600}
select{font:15px system-ui;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pill{font-size:12px;border-radius:20px;padding:3px 9px;background:var(--bg);border:1px solid var(--line)}
.big{font-size:44px;font-weight:800;margin:0}
.pass{color:var(--ok)}.fail{color:var(--bad)}
</style>
</head>
<body>
<header><h1>RBT Exam Prep</h1><p>Aligned to the BACB RBT Test Content Outline (3rd ed.) — exams from Jan 1, 2026</p></header>
<main id="app"></main>
<nav id="nav">
 <a href="#home"><b>⌂</b>Home</a><a href="#plan"><b>☑</b>Plan</a><a href="#cheat"><b>✎</b>Cheat</a><a href="#flash"><b>⧉</b>Cards</a><a href="#drill"><b>✓</b>Drill</a><a href="#exam"><b>⏱</b>Exam</a>
</nav>
<script>
const D = {"q": [{"id": 1, "d": "A", "t": "A.1", "q": "An RBT makes a tally mark every time a client raises his hand during a 30-minute group lesson. Which measurement procedure is being used?", "o": ["Momentary time sampling", "Latency recording", "Frequency (event) recording", "Duration recording"], "a": 2, "e": "Counting each occurrence of a behavior with a clear beginning and end is frequency (count/event) recording, a continuous measure."}, {"id": 2, "d": "A", "t": "A.6", "q": "A client hit peers 12 times during a 30-minute session. What is the rate of hitting?", "o": ["0.4 per minute", "0.25 per minute", "12 per minute", "2.5 per minute"], "a": 0, "e": "Rate = count ÷ time. 12 ÷ 30 minutes = 0.4 responses per minute."}, {"id": 3, "d": "A", "t": "A.1", "q": "An RBT starts a stopwatch when a tantrum begins and stops it when the tantrum ends. What is being measured?", "o": ["Latency", "Inter-response time", "Duration", "Rate"], "a": 2, "e": "Duration is the total time from the onset to the offset of a behavior."}, {"id": 4, "d": "A", "t": "A.1", "q": "The RBT says 'Put on your shoes' and records that the client started putting on shoes 45 seconds later. What dimension was measured?", "o": ["Frequency", "Inter-response time", "Duration", "Latency"], "a": 3, "e": "Latency is the time from the presentation of an SD/instruction to the start of the response."}, {"id": 5, "d": "A", "t": "A.1", "q": "An RBT records the time that passes between the end of one vocal tic and the start of the next one. This is:", "o": ["Rate", "Inter-response time (IRT)", "Duration", "Latency"], "a": 1, "e": "IRT is the time between the end of one response and the beginning of the next response."}, {"id": 6, "d": "A", "t": "A.2", "q": "With whole-interval recording, an interval is scored as an occurrence only if the behavior:", "o": ["Is occurring at the moment the interval ends", "Occurs throughout the entire interval", "Occurs at any time during the interval", "Occurs at least twice in the interval"], "a": 1, "e": "Whole interval = behavior occurs for the whole interval. It tends to UNDERESTIMATE and is best for behaviors you want to increase (e.g., on-task)."}, {"id": 7, "d": "A", "t": "A.2", "q": "Which discontinuous method tends to OVERESTIMATE the occurrence of behavior and is often used for behaviors targeted for decrease?", "o": ["Duration recording", "Whole-interval recording", "Partial-interval recording", "Permanent product recording"], "a": 2, "e": "Partial interval scores an interval if the behavior occurs at ANY point, so it overestimates; useful for problem behavior you want to reduce."}, {"id": 8, "d": "A", "t": "A.2", "q": "Every 5 minutes a timer beeps and the RBT looks up and records whether the client is in his seat at that exact moment. This is:", "o": ["Partial-interval recording", "Frequency recording", "Whole-interval recording", "Momentary time sampling"], "a": 3, "e": "Momentary time sampling (MTS) records only whether the behavior is occurring at the moment the interval ends."}, {"id": 9, "d": "A", "t": "A.3", "q": "Counting the number of correctly completed math problems on a worksheet after the session is an example of:", "o": ["Momentary time sampling", "Permanent product recording", "Latency recording", "ABC recording"], "a": 1, "e": "Permanent product recording measures the lasting outcome (product) of a behavior after it has occurred."}, {"id": 10, "d": "A", "t": "A.5", "q": "Which of the following is the BEST observable and measurable definition of aggression?", "o": ["Having a bad attitude", "Acting out when frustrated", "Being angry toward peers", "Hitting others with an open or closed hand, from contact to release"], "a": 3, "e": "Operational definitions describe what the behavior looks like so two observers could agree. Words like 'angry', 'frustrated', or 'attitude' are not observable."}, {"id": 11, "d": "A", "t": "A.6", "q": "A client answered 8 of 10 trials correctly. What percentage correct should be recorded?", "o": ["10%", "8%", "80%", "20%"], "a": 2, "e": "Percentage = (correct ÷ total trials) × 100 = 8 ÷ 10 × 100 = 80%."}, {"id": 12, "d": "A", "t": "A.6", "q": "A client had three tantrums lasting 4, 6, and 8 minutes. What is the mean duration per tantrum?", "o": ["3 minutes", "6 minutes", "18 minutes", "4 minutes"], "a": 1, "e": "Mean duration = total duration ÷ number of occurrences = 18 ÷ 3 = 6 minutes."}, {"id": 13, "d": "A", "t": "A.7", "q": "On a line graph of a skill-acquisition target, the data points rise steadily across sessions. This shows:", "o": ["A decreasing trend", "High variability", "No trend (stable)", "An increasing trend"], "a": 3, "e": "Trend is the overall direction of the data path. Data moving upward = increasing (ascending) trend."}, {"id": 14, "d": "A", "t": "A.4", "q": "On a standard ABA line graph, what is usually plotted on the horizontal (x) axis?", "o": ["The intervention name", "The client's name", "Time / sessions", "The behavior measure (e.g., frequency)"], "a": 2, "e": "The x-axis shows time (sessions, days); the y-axis shows the measure of behavior. Phase-change lines mark condition changes."}, {"id": 15, "d": "A", "t": "A.8", "q": "An RBT frequently guesses data at the end of the day instead of recording during the session. What is the MAIN risk?", "o": ["It takes more time to enter", "The client will notice", "The supervisor may make treatment decisions based on inaccurate data", "The graph will look messy"], "a": 2, "e": "Unreliable data lead to poor clinical decisions (e.g., changing or keeping an ineffective program). Record data accurately and as it happens."}, {"id": 16, "d": "A", "t": "A.8", "q": "An RBT delivers reinforcement after every other correct response even though the plan says to reinforce every correct response. This is a problem with:", "o": ["Interobserver agreement", "Procedural fidelity (treatment integrity)", "Permanent product recording", "Generalization"], "a": 1, "e": "Procedural fidelity is implementing the plan exactly as written. Poor fidelity makes it impossible to know whether the intervention works."}, {"id": 17, "d": "A", "t": "A.4", "q": "When should session data normally be entered and graphs updated?", "o": ["Once a month before supervision", "Only if the supervisor asks", "Promptly, per agency policy (e.g., right after the session)", "Only when the client masters the target"], "a": 2, "e": "Data should be entered and graphed promptly so the supervisor can make timely, data-based decisions."}, {"id": 18, "d": "A", "t": "A.6", "q": "Using 10-second partial-interval recording, the behavior was scored in 6 of 20 intervals. What should be reported?", "o": ["30%", "20%", "60%", "6%"], "a": 0, "e": "Interval data are reported as the percentage of intervals: 6 ÷ 20 × 100 = 30%."}, {"id": 19, "d": "A", "t": "A.6", "q": "Sessions with a client vary from 30 to 90 minutes. Which measure allows a fair comparison of a behavior across sessions?", "o": ["Latency", "Total duration only", "Raw count", "Rate (count per unit of time)"], "a": 3, "e": "When observation periods differ, convert count to rate (count ÷ time) so sessions can be compared."}, {"id": 20, "d": "A", "t": "A.8", "q": "Two observers independently record the same session and compare their data. This is done to check:", "o": ["Social validity", "Interobserver agreement (data reliability)", "Procedural fidelity", "Generalization"], "a": 1, "e": "Interobserver agreement (IOA) shows whether the data are believable/reliable by comparing two independent observers."}, {"id": 21, "d": "A", "t": "A.7", "q": "A graph of self-injury (a target for decrease) shows a flat, high level of responding for two weeks after a new intervention started. What should the RBT do?", "o": ["Stop collecting data", "Keep implementing as written and inform the supervisor", "Change the intervention on their own", "Delete the high data points"], "a": 1, "e": "RBTs report data patterns to the supervisor; the supervisor makes program changes. Never alter data or change the plan independently."}, {"id": 22, "d": "A", "t": "A.6", "q": "A client's daily counts of manding were 4, 6, 5, and 9. What is the mean (average) count per day?", "o": ["5", "6", "9", "24"], "a": 1, "e": "Add the values (4+6+5+9 = 24) and divide by the number of days (4) = 6."}, {"id": 23, "d": "A", "t": "A.3", "q": "Which is a limitation of permanent product recording?", "o": ["It requires the observer to be present the entire time", "It cannot be used for academic work", "It always overestimates behavior", "You may not know who actually produced the product or how"], "a": 3, "e": "Permanent products don't require direct observation, but you can't always confirm who produced the outcome or how it was produced."}, {"id": 24, "d": "A", "t": "A.2", "q": "An RBT wants to increase a child's on-task behavior and needs a conservative estimate. Which discontinuous method is the BEST fit?", "o": ["Partial-interval recording", "Whole-interval recording", "Permanent product", "Frequency recording"], "a": 1, "e": "Whole-interval recording underestimates, so it's a conservative choice for behaviors you want to increase, like on-task."}, {"id": 25, "d": "A", "t": "A.7", "q": "Data points that bounce widely up and down from session to session show high:", "o": ["Variability", "Trend", "Level", "Latency"], "a": 0, "e": "Variability describes how much data points differ from one another. High variability makes it harder to judge treatment effects."}, {"id": 26, "d": "B", "t": "B.1", "q": "Items are presented two at a time, every item is paired with every other item, and the client chooses one each trial. This is a:", "o": ["Single-stimulus assessment", "Multiple stimulus without replacement (MSWO)", "Paired-stimulus (forced-choice) preference assessment", "Free-operant observation"], "a": 2, "e": "Paired-stimulus (forced choice) presents items in pairs until each has been paired with every other item; items are ranked by % chosen."}, {"id": 27, "d": "B", "t": "B.1", "q": "An array of 6 items is presented. After the client picks one, that item is NOT returned and the remaining items are re-presented. This is:", "o": ["Paired stimulus", "MSW (with replacement)", "Free operant", "MSWO (multiple stimulus without replacement)"], "a": 3, "e": "In MSWO, the selected item is removed from the array, producing a ranked hierarchy of preferences."}, {"id": 28, "d": "B", "t": "B.1", "q": "A client is allowed free access to many toys for 10 minutes while the RBT records how long the client engages with each. Nothing is removed. This is a:", "o": ["MSWO", "Paired-stimulus assessment", "Free-operant preference assessment", "Functional analysis"], "a": 2, "e": "Free-operant assessment measures duration of engagement with freely available items; it tends to produce little problem behavior since nothing is taken away."}, {"id": 29, "d": "B", "t": "B.1", "q": "Why are brief preference assessments conducted frequently (e.g., before sessions)?", "o": ["Preferences can change over time due to things like satiation and deprivation", "The BACB requires them daily", "They identify the function of behavior", "They replace the need for reinforcement"], "a": 0, "e": "Preferences shift with motivating operations (satiation/deprivation), so frequent checks keep reinforcers effective."}, {"id": 30, "d": "B", "t": "B.1", "q": "A client always picks the iPad in preference assessments. What does this tell you for certain?", "o": ["The iPad will function as a reinforcer for all behaviors", "The iPad is a highly preferred item, but its reinforcing effect must be confirmed by its effect on behavior", "The client has an iPad addiction", "The assessment was done wrong"], "a": 1, "e": "Preference does not guarantee reinforcement. A reinforcer is defined by its effect: it increases future behavior."}, {"id": 31, "d": "B", "t": "B.1", "q": "Items are presented one at a time and the RBT records approach or engagement with each. This is best for clients who:", "o": ["Have difficulty scanning or choosing between multiple items", "Easily choose between many items", "Are being assessed for function", "Need a functional analysis"], "a": 0, "e": "Single-stimulus (successive choice) presentation suits learners who can't yet make choices among multiple items."}, {"id": 32, "d": "B", "t": "B.2", "q": "An RBT helps a BCBA administer the VB-MAPP to identify a client's skill strengths and deficits. This is an example of a:", "o": ["Functional analysis", "Descriptive assessment of problem behavior", "Curriculum-based/skills assessment", "Preference assessment"], "a": 2, "e": "Tools such as the VB-MAPP and ABLLS-R are curriculum-based/developmental assessments of skill strengths and deficits."}, {"id": 33, "d": "B", "t": "B.3", "q": "An RBT writes down what happened right before and right after each instance of problem behavior during natural routines. This is:", "o": ["Permanent product recording", "A preference assessment", "ABC (descriptive) data collection", "A functional analysis"], "a": 2, "e": "ABC recording is a descriptive assessment: Antecedent, Behavior, Consequence observed in the natural environment without manipulating variables."}, {"id": 34, "d": "B", "t": "B.3", "q": "\"The teacher told Sam to clean up. Sam threw blocks. The teacher let Sam go to recess.\" In this ABC sequence, the antecedent is:", "o": ["The teacher told Sam to clean up", "Sam went to recess", "Sam threw blocks", "The blocks"], "a": 0, "e": "The antecedent is what happens immediately before the behavior — here, the instruction to clean up."}, {"id": 35, "d": "B", "t": "B.3", "q": "In a functional analysis (FA), the supervisor systematically manipulates conditions such as attention, demand, alone, and play. What is the play/control condition used for?", "o": ["To test the escape function", "As a comparison where reinforcers are freely available and no demands are placed", "To increase problem behavior", "To teach new skills"], "a": 1, "e": "The play (control) condition has free attention and items with no demands; it should produce low problem behavior for comparison."}, {"id": 36, "d": "B", "t": "B.3", "q": "Which assessment involves directly manipulating antecedents and consequences to test their effect on problem behavior?", "o": ["Functional analysis", "Indirect assessment (interviews)", "Descriptive assessment (ABC)", "Preference assessment"], "a": 0, "e": "A functional analysis is experimental: it manipulates variables to demonstrate the function of behavior."}, {"id": 37, "d": "B", "t": "B.3", "q": "What is the RBT's role in functional assessment procedures?", "o": ["Designing the FA and interpreting the results", "Choosing the behavior plan alone", "Diagnosing the client", "Implementing assessment components (e.g., collecting ABC data, running FA conditions) under supervisor direction"], "a": 3, "e": "RBTs participate in components of assessment as directed. Designing, interpreting, and writing plans are the supervisor's role."}, {"id": 38, "d": "B", "t": "B.3", "q": "Interviews and rating scales completed by caregivers (e.g., the QABF or MAS) are examples of:", "o": ["Descriptive assessment", "Indirect assessment", "Permanent product", "Functional analysis"], "a": 1, "e": "Indirect assessments gather information from people who know the client rather than direct observation."}, {"id": 39, "d": "B", "t": "B.3", "q": "A graph showing at what times of day problem behavior tends to occur most is called a:", "o": ["Bar graph of IOA", "Scatterplot", "Reversal design", "Cumulative record"], "a": 1, "e": "A scatterplot is a descriptive tool that reveals temporal patterns (times/activities) linked to behavior."}, {"id": 40, "d": "B", "t": "B.2", "q": "A social skills assessment checklist shows the client cannot yet initiate play with peers. This information is MOST useful for:", "o": ["Determining the function of aggression", "Calculating IOA", "Selecting a time-out procedure", "Identifying skill deficits to target for teaching"], "a": 3, "e": "Skills assessments identify strengths and deficits that the supervisor uses to select acquisition goals."}, {"id": 41, "d": "C", "t": "C.1", "q": "A child says 'cookie' and is immediately given a cookie. Afterward, the child says 'cookie' more often. This is:", "o": ["Extinction", "Positive punishment", "Negative reinforcement", "Positive reinforcement"], "a": 3, "e": "Positive reinforcement = a stimulus is ADDED after a behavior and the behavior INCREASES in the future."}, {"id": 42, "d": "C", "t": "C.1", "q": "A student asks for a break, and the RBT removes the work for 2 minutes. Requests for breaks increase. This is:", "o": ["Positive reinforcement", "Negative reinforcement", "Response cost", "Negative punishment"], "a": 1, "e": "Negative reinforcement = a stimulus (work demand) is REMOVED and the behavior INCREASES."}, {"id": 43, "d": "C", "t": "C.1", "q": "For reinforcement to be MOST effective during teaching, it should be delivered:", "o": ["Randomly, regardless of behavior", "Only when the client asks", "At the end of the day", "Immediately and contingent on the target response"], "a": 3, "e": "Immediacy and contingency strengthen the connection between the response and the reinforcer."}, {"id": 44, "d": "C", "t": "C.1", "q": "When teaching a brand-new skill, which reinforcement schedule is generally recommended first?", "o": ["Continuous reinforcement (CRF / FR1)", "Variable ratio 10", "Fixed interval 5 minutes", "Extinction"], "a": 0, "e": "Continuous reinforcement speeds acquisition; the schedule is thinned to intermittent reinforcement later to promote maintenance."}, {"id": 45, "d": "C", "t": "C.1", "q": "Reinforcement is delivered after an average of every 5 correct responses (sometimes 3, sometimes 7). This schedule is:", "o": ["Fixed interval 5", "Fixed ratio 5", "Variable interval 5", "Variable ratio 5"], "a": 3, "e": "Variable ratio = reinforcement after a varying number of responses around an average. VR schedules produce high, steady rates."}, {"id": 46, "d": "C", "t": "C.1", "q": "Which schedule delivers reinforcement for the first response after a set, unchanging amount of time has passed?", "o": ["Variable ratio", "Variable interval", "Fixed ratio", "Fixed interval"], "a": 3, "e": "Fixed interval (FI) = first response after a fixed time period is reinforced. It often produces a 'scallop' pattern."}, {"id": 47, "d": "C", "t": "C.2", "q": "An RBT says 'Great job!' every time she delivers a preferred snack so that praise will eventually work as a reinforcer by itself. This process is called:", "o": ["Shaping", "Chaining", "Pairing (establishing a conditioned reinforcer)", "Extinction"], "a": 2, "e": "Pairing a neutral stimulus with an established reinforcer creates a conditioned (secondary) reinforcer."}, {"id": 48, "d": "C", "t": "C.2", "q": "Which of the following is an UNconditioned (primary) reinforcer?", "o": ["Water when thirsty", "Money", "Tokens", "Praise"], "a": 0, "e": "Unconditioned reinforcers (food, water, warmth) need no learning history. Money, tokens, and praise are conditioned."}, {"id": 49, "d": "C", "t": "C.2", "q": "Tokens that can be exchanged for many different backup reinforcers are called:", "o": ["Discriminative stimuli", "Unconditioned reinforcers", "Prompts", "Generalized conditioned reinforcers"], "a": 3, "e": "Generalized conditioned reinforcers (tokens, money) are paired with many backups, so they are less affected by satiation."}, {"id": 50, "d": "C", "t": "C.3", "q": "Which sequence correctly describes a discrete trial?", "o": ["Response → SD → consequence", "Prompt → consequence → SD", "SD → (prompt) → response → consequence → intertrial interval", "Consequence → response → SD"], "a": 2, "e": "A discrete trial: discriminative stimulus (instruction), optional prompt, learner response, consequence, then a brief intertrial interval."}, {"id": 51, "d": "C", "t": "C.4", "q": "During play, a child reaches toward a bubble wand on a high shelf. The RBT waits for the child to say 'bubbles' before giving it. This is an example of:", "o": ["Response cost", "Backward chaining", "Naturalistic (incidental) teaching", "Discrete-trial teaching"], "a": 2, "e": "Naturalistic teaching uses the learner's motivation in the natural environment to teach skills, often learner-initiated."}, {"id": 52, "d": "C", "t": "C.4", "q": "Compared with DTT, a key feature of naturalistic teaching (NET) is that:", "o": ["It never uses prompts", "Teaching is embedded in natural activities and follows the learner's motivation", "Reinforcers are unrelated to the activity", "It happens only at a table"], "a": 1, "e": "NET uses natural contexts and often natural reinforcers (the item/activity requested), which supports generalization."}, {"id": 53, "d": "C", "t": "C.5", "q": "Breaking 'washing hands' into small, sequential steps (turn on water, wet hands, get soap…) is called a:", "o": ["Task analysis", "Preference assessment", "Token economy", "Functional analysis"], "a": 0, "e": "A task analysis breaks a complex skill into smaller teachable steps, which are then taught using chaining."}, {"id": 54, "d": "C", "t": "C.5", "q": "In backward chaining, the learner is first taught to independently complete:", "o": ["All steps at once", "The first step", "The last step", "The hardest step"], "a": 2, "e": "Backward chaining: all steps are completed for/with the learner except the last, which the learner does independently and immediately contacts reinforcement."}, {"id": 55, "d": "C", "t": "C.5", "q": "The learner is prompted through ALL steps of the chain every session, with prompts faded across steps. This is:", "o": ["Total-task chaining", "Forward chaining", "Backward chaining", "Shaping"], "a": 0, "e": "Total-task chaining teaches every step of the chain each time it's presented."}, {"id": 56, "d": "C", "t": "C.5", "q": "In forward chaining, reinforcement is delivered when the learner:", "o": ["Says the steps aloud", "Completes the first (target) step independently, then the rest is completed with help", "Completes any random step", "Finishes only the last step"], "a": 1, "e": "Forward chaining teaches step 1 first; once mastered, step 1 + step 2, and so on."}, {"id": 57, "d": "C", "t": "C.6", "q": "A learner is reinforced for touching the red card when told 'Touch red' but not for touching the blue card. The instruction 'touch red' with the red card present is the:", "o": ["S-delta", "Discriminative stimulus (SD)", "Motivating operation", "Conditioned punisher"], "a": 1, "e": "The SD signals that reinforcement is available for a response; the S-delta signals it is NOT available."}, {"id": 58, "d": "C", "t": "C.6", "q": "When a behavior occurs reliably in the presence of the SD and not in the presence of the S-delta, the behavior is said to be under:", "o": ["Stimulus control", "Extinction", "Response cost", "Satiation"], "a": 0, "e": "Stimulus control is the result of discrimination training."}, {"id": 59, "d": "C", "t": "C.7", "q": "Which of the following is a RESPONSE prompt?", "o": ["Highlighting the correct word in color", "Making the correct answer larger", "Physically guiding the learner's hand", "Placing the correct card closer to the learner"], "a": 2, "e": "Response prompts act on the learner's response (physical, model, gestural, verbal). Position/size/color changes are stimulus prompts."}, {"id": 60, "d": "C", "t": "C.7", "q": "An RBT starts with full physical guidance and gradually provides less assistance as the learner becomes successful. This is:", "o": ["Most-to-least prompting", "Stimulus fading only", "Shaping", "Least-to-most prompting"], "a": 0, "e": "Most-to-least begins with the most intrusive prompt and fades to less intrusive prompts; it minimizes errors (errorless learning)."}, {"id": 61, "d": "C", "t": "C.7", "q": "The RBT waits 0 seconds before prompting for the first trials, then gradually increases the wait to 2, 4, and 6 seconds. This prompt-fading method is:", "o": ["Least-to-most prompting", "Graduated guidance", "Stimulus shaping", "Progressive time delay"], "a": 3, "e": "Progressive time delay gradually increases the delay between the SD and the prompt."}, {"id": 62, "d": "C", "t": "C.7", "q": "Why must prompts be faded systematically?", "o": ["To prevent prompt dependence and transfer control to the natural SD", "Prompts are unethical", "Prompts make data collection harder", "Fading is required for chaining only"], "a": 0, "e": "Fading moves stimulus control from the prompt to the natural SD so the learner responds independently."}, {"id": 63, "d": "C", "t": "C.7", "q": "In least-to-most prompting, the RBT:", "o": ["Gives the learner a chance to respond independently and adds more assistance only as needed", "Begins with the most intrusive prompt", "Never uses physical prompts", "Provides the same prompt every trial"], "a": 0, "e": "Least-to-most starts with the least assistance and increases intrusiveness after errors/no response."}, {"id": 64, "d": "C", "t": "C.8", "q": "A child labels a dog in flashcards but not at the park or in books. What procedure would help?", "o": ["Response cost", "Extinction", "Using only one picture", "Teaching with multiple exemplars across settings and materials (generalization programming)"], "a": 3, "e": "Generalization is promoted by teaching across multiple exemplars, people, settings, and using natural reinforcers."}, {"id": 65, "d": "C", "t": "C.8", "q": "A learner taught to say 'Hi' to her RBT now also says 'Hi' to her teacher and siblings without being taught. This is:", "o": ["Response cost", "Extinction", "Maintenance", "Stimulus generalization"], "a": 3, "e": "Stimulus generalization = the behavior occurs in the presence of stimuli (people/settings) other than those used in training."}, {"id": 66, "d": "C", "t": "C.9", "q": "A skill continues to occur months after formal teaching stopped. This is called:", "o": ["Acquisition", "Shaping", "Maintenance", "Spontaneous recovery"], "a": 2, "e": "Maintenance is the continued performance of a behavior over time after the intervention has been withdrawn."}, {"id": 67, "d": "C", "t": "C.9", "q": "Which practice is MOST associated with maintenance procedures (vs. acquisition)?", "o": ["Heavy prompting", "Intermittent reinforcement and periodic probes of mastered targets", "Continuous reinforcement for every correct response", "Introducing new targets every trial"], "a": 1, "e": "Maintenance programming thins reinforcement and periodically reviews mastered skills; acquisition uses dense reinforcement and prompting to teach new skills."}, {"id": 68, "d": "C", "t": "C.10", "q": "Reinforcing 'buh', then 'bah', then 'ball' to teach a child to say 'ball' is an example of:", "o": ["Discrimination training", "Shaping", "Chaining", "Prompt fading"], "a": 1, "e": "Shaping = differential reinforcement of successive approximations toward a terminal behavior."}, {"id": 69, "d": "C", "t": "C.10", "q": "Which statement best distinguishes shaping from chaining?", "o": ["Shaping links multiple behaviors; chaining changes one behavior's form", "They are the same", "Shaping requires tokens", "Shaping changes one behavior through successive approximations; chaining links a sequence of separate behaviors"], "a": 3, "e": "Shaping refines a single response; chaining connects several discrete responses in a sequence."}, {"id": 70, "d": "C", "t": "C.11", "q": "In a token economy, the items or activities that tokens can be exchanged for are called:", "o": ["Discriminative stimuli", "Prompts", "Backup reinforcers", "Establishing operations"], "a": 2, "e": "Tokens are conditioned reinforcers exchanged for backup reinforcers based on a set exchange rate."}, {"id": 71, "d": "C", "t": "C.11", "q": "Which is an essential part of setting up a token economy?", "o": ["Tokens can't be exchanged", "Clear target behaviors, token delivery rules, and an exchange schedule for backup reinforcers", "Tokens are given randomly", "Using only food as tokens"], "a": 1, "e": "Token economies specify target behaviors, how/when tokens are earned, and how/when they are exchanged."}, {"id": 72, "d": "C", "t": "C.1", "q": "A child has not had any snacks all afternoon, and crackers now function as a very effective reinforcer. This increase in reinforcer value is due to:", "o": ["Extinction", "Satiation (abolishing operation)", "Deprivation (establishing operation)", "Stimulus control"], "a": 2, "e": "An establishing operation (e.g., deprivation) temporarily increases the value of a reinforcer and behavior that has produced it."}, {"id": 73, "d": "C", "t": "C.3", "q": "During DTT, the learner gives an incorrect response. A common error-correction procedure is to:", "o": ["Represent the SD with an immediate prompt, then give another opportunity", "Give the reinforcer anyway", "Yell 'No!'", "End the session"], "a": 0, "e": "Typical error correction: re-present the trial with a prompt to ensure success, then present a trial at the independent level as the plan specifies."}, {"id": 74, "d": "C", "t": "C.3", "q": "Mixing easy, mastered tasks among new, difficult targets during DTT is called:", "o": ["Extinction", "Chaining", "Interspersal", "Shaping"], "a": 2, "e": "Interspersing mastered tasks builds momentum, maintains skills, and keeps reinforcement rates high."}, {"id": 75, "d": "C", "t": "C.1", "q": "Behaviors maintained on intermittent schedules, compared to continuous schedules, are generally:", "o": ["Less resistant to extinction", "More resistant to extinction", "Impossible to maintain", "Punished more"], "a": 1, "e": "Intermittent reinforcement produces greater resistance to extinction, which is why it supports maintenance."}, {"id": 76, "d": "C", "t": "C.4", "q": "Which is a natural reinforcer for the response 'Open' when a child wants a snack container opened?", "o": ["Praise only", "A token", "Opening the container", "A sticker"], "a": 2, "e": "A natural reinforcer is the direct, logical outcome of the response — the container being opened."}, {"id": 77, "d": "C", "t": "C.7", "q": "Placing the correct picture closer to the learner than the other pictures is an example of a:", "o": ["Verbal prompt", "Model prompt", "Positional (stimulus) prompt", "Response prompt"], "a": 2, "e": "Positional prompts alter the stimulus arrangement and are a type of stimulus prompt."}, {"id": 78, "d": "C", "t": "C.2", "q": "Before starting work demands with a new client, the RBT spends time delivering preferred items and fun activities with no demands. The purpose is to:", "o": ["Pair themself with reinforcement and build rapport", "Satiate the client", "Assess function", "Conduct extinction"], "a": 0, "e": "Pairing the therapist with reinforcement helps the RBT become a conditioned reinforcer, building instructional control."}, {"id": 79, "d": "D", "t": "D.1", "q": "Which list contains the four common functions of behavior?", "o": ["Frequency, duration, latency, IRT", "Anger, boredom, sadness, fear", "Shaping, chaining, prompting, fading", "Attention, escape, tangible (access), automatic"], "a": 3, "e": "Behavior commonly serves to get attention, escape/avoid, get access to tangibles, or produce automatic (sensory) reinforcement — remember SEAT."}, {"id": 80, "d": "D", "t": "D.1", "q": "Every time a math worksheet is presented, Ava rips it up and is sent to the hallway. Ripping increases. The MOST likely function is:", "o": ["Attention", "Automatic", "Tangible", "Escape/avoidance"], "a": 3, "e": "Ripping removes the task (she leaves the demand), so the behavior is likely negatively reinforced by escape."}, {"id": 81, "d": "D", "t": "D.1", "q": "A child rocks and hums alone in his room for long periods, regardless of whether anyone is present. The MOST likely function is:", "o": ["Attention", "Automatic (sensory)", "Tangible", "Escape"], "a": 1, "e": "Behavior that persists when alone, without social consequences, is likely maintained by automatic reinforcement."}, {"id": 82, "d": "D", "t": "D.1", "q": "When his mom gets on the phone, Leo screams until she hangs up and talks to him. The likely function is:", "o": ["Attention", "Tangible", "Automatic", "Escape"], "a": 0, "e": "Screaming is followed by mom's attention, suggesting socially mediated positive reinforcement (attention)."}, {"id": 83, "d": "D", "t": "D.2", "q": "A client receives attention on a fixed-time schedule (every 2 minutes) regardless of behavior. This antecedent intervention is:", "o": ["Noncontingent reinforcement (NCR)", "Extinction", "DRO", "Time-out"], "a": 0, "e": "NCR delivers the maintaining reinforcer on a time-based schedule independent of behavior, reducing motivation for problem behavior."}, {"id": 84, "d": "D", "t": "D.2", "q": "Before a difficult instruction ('Put away toys'), the RBT gives 3 quick, easy instructions the child usually follows ('Touch head', 'Clap', 'High five'). This is a:", "o": ["Response cost", "DRL", "Demand fading procedure", "High-probability (high-p) request sequence"], "a": 3, "e": "High-p sequences build behavioral momentum so the learner is more likely to comply with the low-probability request."}, {"id": 85, "d": "D", "t": "D.2", "q": "Demands are temporarily removed and then gradually reintroduced as problem behavior stays low. This is:", "o": ["Response cost", "Extinction burst", "Overcorrection", "Demand fading"], "a": 3, "e": "Demand fading is an antecedent strategy often used for escape-maintained behavior."}, {"id": 86, "d": "D", "t": "D.2", "q": "Which is an antecedent intervention?", "o": ["Removing a token after aggression", "Offering choices and using a visual schedule before transitions", "Time-out", "Planned ignoring"], "a": 1, "e": "Antecedent interventions change the environment BEFORE behavior to reduce the likelihood of problem behavior."}, {"id": 87, "d": "D", "t": "D.3", "q": "A child who grabs toys is taught to say 'My turn, please' and is reinforced only for that request while grabbing no longer gets toys. This is:", "o": ["NCR", "DRO", "DRA (differential reinforcement of alternative behavior)", "DRL"], "a": 2, "e": "DRA reinforces an appropriate alternative behavior and withholds reinforcement for the problem behavior."}, {"id": 88, "d": "D", "t": "D.3", "q": "A child who flaps his hands is reinforced for keeping his hands in his pockets, which cannot occur at the same time as flapping. This is:", "o": ["NCR", "DRI (incompatible behavior)", "DRL", "DRO"], "a": 1, "e": "DRI reinforces a behavior that is physically incompatible with the problem behavior."}, {"id": 89, "d": "D", "t": "D.3", "q": "A client receives a reinforcer at the end of every 5-minute interval in which no hitting occurred. This is:", "o": ["Extinction", "DRL", "DRO (differential reinforcement of other behavior)", "DRA"], "a": 2, "e": "DRO delivers reinforcement for the ABSENCE of the target behavior during an interval."}, {"id": 90, "d": "D", "t": "D.3", "q": "A student asks questions too often. The goal is to reduce, not eliminate, questions, so reinforcement is given if she asks 3 or fewer per class. This is:", "o": ["DRL (differential reinforcement of low rates)", "DRI", "DRO", "NCR"], "a": 0, "e": "DRL is used when a behavior is acceptable but occurs too frequently."}, {"id": 91, "d": "D", "t": "D.3", "q": "A child who screams to escape work is taught to hand over a 'break' card. This is called:", "o": ["Response cost", "Time-out", "Overcorrection", "Functional communication training (FCT)"], "a": 3, "e": "FCT teaches a communicative response that serves the SAME function as the problem behavior (here, escape)."}, {"id": 92, "d": "D", "t": "D.3", "q": "When selecting a replacement behavior, the MOST important consideration is that it:", "o": ["Serves the same function as the problem behavior and is easy for the learner", "Never contacts reinforcement", "Is difficult to perform", "Is chosen by the RBT"], "a": 0, "e": "A replacement behavior should be functionally equivalent and more efficient than the problem behavior."}, {"id": 93, "d": "D", "t": "D.4", "q": "Tantrums were maintained by attention. The plan now says to withhold attention for tantrums. This procedure is:", "o": ["Extinction", "NCR", "Negative punishment", "Positive punishment"], "a": 0, "e": "Extinction = discontinuing the reinforcer that previously maintained the behavior."}, {"id": 94, "d": "D", "t": "D.4", "q": "For escape-maintained behavior, escape extinction would involve:", "o": ["Giving a break whenever problem behavior occurs", "Ignoring the child", "Continuing to present the demand and not allowing escape contingent on problem behavior", "Sending the child to time-out"], "a": 2, "e": "Escape extinction means problem behavior no longer results in removal of the demand (follow through as written in the plan)."}, {"id": 95, "d": "D", "t": "D.6", "q": "Right after extinction begins, a child's crying gets louder and more frequent before it decreases. This is called:", "o": ["Spontaneous recovery", "Generalization", "Resurgence", "An extinction burst"], "a": 3, "e": "An extinction burst is a temporary increase in frequency, duration, or intensity when extinction is first implemented."}, {"id": 96, "d": "D", "t": "D.6", "q": "Weeks after tantrums stopped under extinction, a tantrum suddenly reappears briefly. This is:", "o": ["Spontaneous recovery", "Extinction burst", "Shaping", "Response generalization"], "a": 0, "e": "Spontaneous recovery is the reappearance of a previously extinguished behavior after time has passed."}, {"id": 97, "d": "D", "t": "D.6", "q": "A child was taught to mand for breaks instead of hitting. When manding was put on extinction, hitting returned. This is:", "o": ["Resurgence", "Spontaneous recovery", "Stimulus control", "Maintenance"], "a": 0, "e": "Resurgence is the reoccurrence of a previously reinforced behavior when a more recently reinforced behavior is placed on extinction."}, {"id": 98, "d": "D", "t": "D.6", "q": "Which is a possible side effect of extinction the RBT should be prepared for and report?", "o": ["Immediate permanent decrease", "Automatic generalization", "Emotional responding or aggression (extinction-induced)", "Increased IOA"], "a": 2, "e": "Extinction can produce emotional responding, aggression, response variation, and bursts."}, {"id": 99, "d": "D", "t": "D.5", "q": "A student loses 5 minutes of recess each time he curses, and cursing decreases. This is:", "o": ["Extinction", "Negative punishment (response cost)", "Negative reinforcement", "Positive punishment"], "a": 1, "e": "Removing a stimulus (minutes of recess) contingent on behavior that DECREASES the behavior is negative punishment; losing reinforcers is response cost."}, {"id": 100, "d": "D", "t": "D.5", "q": "After a child touches a hot stove she gets burned and never touches it again. This is:", "o": ["Extinction", "Negative punishment", "Positive punishment", "Negative reinforcement"], "a": 2, "e": "Positive punishment = a stimulus is ADDED after a behavior and the behavior DECREASES."}, {"id": 101, "d": "D", "t": "D.5", "q": "Time-out from positive reinforcement is effective ONLY if:", "o": ["The 'time-in' environment is reinforcing", "The time-out area is fun", "It lasts at least 1 hour", "The behavior is escape-maintained"], "a": 0, "e": "Time-out removes access to reinforcement; if time-in isn't reinforcing (or the behavior is escape-maintained), time-out can actually reinforce behavior."}, {"id": 102, "d": "D", "t": "D.5", "q": "Having a child sit and watch the activity from the side without participating for 2 minutes is:", "o": ["Exclusionary time-out", "DRO", "Nonexclusionary time-out (e.g., contingent observation)", "Overcorrection"], "a": 2, "e": "Nonexclusionary time-out keeps the learner in the setting but removes access to reinforcement."}, {"id": 103, "d": "D", "t": "D.5", "q": "What is the RBT's responsibility regarding punishment procedures?", "o": ["Never document them", "Implement only as written in the behavior plan, with training and supervisor direction", "Design their own punishment program", "Use them whenever behavior is severe"], "a": 1, "e": "RBTs implement behavior-reduction procedures exactly as designed by the supervisor and only after being trained. Reinforcement-based procedures are prioritized."}, {"id": 104, "d": "D", "t": "D.7", "q": "A client begins severe head-banging that could cause injury, and the plan contains a crisis protocol. What should the RBT do FIRST?", "o": ["Leave the room", "Call the parents to ask what to do", "Ignore it because it's attention-maintained", "Follow the crisis/emergency procedure in the plan to keep everyone safe"], "a": 3, "e": "Follow the written crisis plan and agency protocols to ensure safety, then document and notify the supervisor."}, {"id": 105, "d": "D", "t": "D.7", "q": "After a crisis incident in which restraint was used per the plan, the RBT should:", "o": ["Document it per policy and notify the supervisor promptly", "Change the plan", "Only tell the client", "Not mention it to avoid trouble"], "a": 0, "e": "Crisis events must be documented accurately and reported promptly to the supervisor (and others per agency policy)."}, {"id": 106, "d": "D", "t": "D.4", "q": "A parent gives in after 20 minutes of whining during extinction. What is the likely effect?", "o": ["Whining is intermittently reinforced and may become MORE persistent", "No effect", "Whining becomes automatic", "Whining will quickly stop"], "a": 0, "e": "Inconsistent extinction places behavior on an intermittent schedule, making it more resistant to future extinction."}, {"id": 107, "d": "D", "t": "D.4", "q": "For automatically reinforced finger-tapping that produces a sound, sensory extinction might involve:", "o": ["Ignoring the child", "Putting a soft pad on the table to reduce the sound", "Giving more attention", "Time-out"], "a": 1, "e": "Sensory extinction removes or masks the sensory consequence produced by the behavior."}, {"id": 108, "d": "E", "t": "E.4", "q": "Which session note statement is MOST objective?", "o": ["Jayden was manipulative today", "Jayden seemed sad", "Jayden cried for 6 minutes and threw 3 items when asked to complete puzzles", "Jayden was in a terrible mood and didn't want to work"], "a": 2, "e": "Objective notes describe observable, measurable events — not opinions, guesses, or labels."}, {"id": 109, "d": "E", "t": "E.3", "q": "A parent mentions that the client started a new medication and hasn't been sleeping. What should the RBT do?", "o": ["Nothing — it's not behavioral", "Change the reinforcement schedule", "Report this information to the supervisor promptly because it may affect progress", "Tell the parent to stop the medication"], "a": 2, "e": "Medication changes, sleep, illness, and family changes are variables that can affect behavior and must be reported."}, {"id": 110, "d": "E", "t": "E.1", "q": "A caregiver tells the RBT she thinks the token board isn't working and asks to change it. The BEST response is:", "o": ["Acknowledge the concern and tell her you'll share it with the supervisor", "Say it's working and dismiss it", "Change it right away to keep the parent happy", "Tell her to call the BACB"], "a": 0, "e": "RBTs communicate concerns and suggestions from the team to the supervisor; they don't change programs independently."}, {"id": 111, "d": "E", "t": "E.2", "q": "An RBT is unsure how to implement a newly added program. What should she do?", "o": ["Ask the parent how to do it", "Contact the supervisor for clarification before implementing", "Guess and do her best", "Skip the program until the next month"], "a": 1, "e": "Seek clinical direction from the supervisor in a timely manner when unsure."}, {"id": 112, "d": "E", "t": "E.2", "q": "Which issue should be brought to the supervisor's attention MOST urgently?", "o": ["The client mastered a target", "A new behavior that is causing injury to the client", "A minor typo in last week's notes", "The client prefers blue crayons"], "a": 1, "e": "Prioritize: safety and risk of harm come first and require immediate supervisor contact."}, {"id": 113, "d": "E", "t": "E.4", "q": "When is the best time to write session notes?", "o": ["As soon as possible after the session, per agency policy", "Before the session starts", "A week later from memory", "Only when the supervisor asks"], "a": 0, "e": "Timely documentation is more accurate and is often required by agency/funder policy."}, {"id": 114, "d": "E", "t": "E.4", "q": "An RBT made an error on a paper data sheet. What is the appropriate action?", "o": ["Throw the sheet away", "Correct it according to agency policy (e.g., single line, initial, date) — never falsify", "Make up new data", "Use correction fluid to cover it"], "a": 1, "e": "Records must be accurate and honest; corrections follow policy. Altering or fabricating records is unethical."}, {"id": 115, "d": "E", "t": "E.1", "q": "A teacher at the client's school tells the RBT the client is hitting peers at lunch. The RBT should:", "o": ["Start a new intervention at lunch", "Tell the teacher to handle it", "Share the teacher's report with the supervisor", "Ignore it because it's outside session"], "a": 2, "e": "Information from team members (teachers, caregivers) should be communicated to the supervisor."}, {"id": 116, "d": "E", "t": "E.3", "q": "Which is a variable that might affect client progress and should be reported?", "o": ["The RBT's favorite TV show", "The supervisor's car", "A family moved to a new home and a new sibling was born", "The color of the data sheet"], "a": 2, "e": "Major environmental or family changes can influence behavior and should be reported."}, {"id": 117, "d": "E", "t": "E.4", "q": "A parent asks what happened during today's session. The RBT should:", "o": ["Refuse to say anything", "Give a brief, factual summary within their role and refer clinical questions to the supervisor", "Diagnose the child", "Share another client's progress for comparison"], "a": 1, "e": "RBTs can describe what occurred factually but refer interpretation and clinical recommendations to the supervisor."}, {"id": 118, "d": "E", "t": "E.2", "q": "The RBT notices that a skill-acquisition program has not shown progress for 3 weeks. The BEST action is:", "o": ["Keep running it forever without comment", "Stop running it", "Bring the data to the supervisor and ask for direction", "Change the targets yourself"], "a": 2, "e": "Report lack of progress and seek clinical direction; the supervisor modifies programs."}, {"id": 119, "d": "E", "t": "E.4", "q": "A client was injured during a session. Besides ensuring safety and following first-aid protocol, the RBT should:", "o": ["Keep it private", "Edit the session note to leave it out", "Let the parents find out later", "Complete an incident report per agency policy and notify the supervisor"], "a": 3, "e": "Incidents are documented accurately per policy and reported promptly."}, {"id": 120, "d": "E", "t": "E.1", "q": "A parent asks the RBT whether her child will 'grow out of autism.' The RBT should:", "o": ["Explain that this is outside the RBT's role and offer to connect her with the supervisor", "Say yes to reassure her", "Change the subject", "Say no"], "a": 0, "e": "Clinical/prognostic questions are outside the RBT scope; refer to the supervisor."}, {"id": 121, "d": "E", "t": "E.3", "q": "A client arrives to session sick and lethargic, and performance is far below usual. In the session note the RBT should:", "o": ["Add a diagnosis", "Leave it out", "Delete the low data", "Objectively note the client's condition as a variable that may have affected performance and report to the supervisor"], "a": 3, "e": "Noting variables like illness helps the supervisor interpret data correctly."}, {"id": 122, "d": "E", "t": "E.2", "q": "During a session, the RBT receives conflicting instructions from the parent and the written plan. The RBT should:", "o": ["Follow the parent", "Follow the written plan and contact the supervisor about the conflict", "Do neither", "Pick the easier one"], "a": 1, "e": "Follow the supervisor's plan and promptly seek clinical direction to resolve conflicts."}, {"id": 123, "d": "E", "t": "E.4", "q": "Which detail does NOT belong in an objective session note?", "o": ["Targets run and data collected", "Who was present", "The RBT's personal opinion that the parents are lazy", "Problem behaviors and how they were handled per the plan"], "a": 2, "e": "Notes are factual and professional; personal opinions and judgments don't belong."}, {"id": 124, "d": "E", "t": "E.1", "q": "A supervisor gives an RBT corrective feedback on prompting. The MOST professional response is:", "o": ["Complain on social media", "Listen, ask clarifying questions, and apply the feedback", "Argue in front of the family", "Ignore it"], "a": 1, "e": "Receiving and applying feedback is part of professional conduct and competent practice."}, {"id": 125, "d": "E", "t": "E.3", "q": "Which of the following should be reported to the supervisor as a possible barrier to progress?", "o": ["Frequent session cancellations and inconsistent implementation at home", "The weather was nice", "The client mastered a program", "The RBT got a new car"], "a": 0, "e": "Attendance, inconsistent implementation, and other setting events can slow progress and must be communicated."}, {"id": 126, "d": "F", "t": "F.1", "q": "Which is NOT one of the four core principles of the RBT Ethics Code (2.0)?", "o": ["Benefit others", "Treat others with compassion, dignity, and respect", "Maximize billable hours", "Behave with integrity"], "a": 2, "e": "The four core principles: benefit others; treat others with compassion, dignity, and respect; behave with integrity; ensure competence."}, {"id": 127, "d": "F", "t": "F.2", "q": "An RBT is assigned a client whose plan includes a procedure the RBT has never been trained to perform. The RBT should:", "o": ["Skip that procedure permanently", "Ask another RBT to sign off", "Watch a video and try it", "Tell the supervisor and request training before implementing"], "a": 3, "e": "RBTs provide services only after demonstrating competence; request training/oversight from the supervisor."}, {"id": 128, "d": "F", "t": "F.3", "q": "Which statement about RBT supervision is TRUE?", "o": ["Supervision only happens at renewal", "RBTs may practice independently after one year", "Supervision can be by email only", "RBTs must receive ongoing supervision and may not practice without a qualified supervisor"], "a": 3, "e": "RBTs practice under the close, ongoing direction of a qualified RBT Supervisor/Requirements Coordinator; without one they may not practice."}, {"id": 129, "d": "F", "t": "F.3", "q": "An RBT provided 80 hours of behavior-analytic services this month. What is the MINIMUM supervision required?", "o": ["2 hours", "4 hours", "1 hour", "8 hours"], "a": 1, "e": "Minimum supervision = 5% of service hours per calendar month: 80 × 0.05 = 4 hours (with at least two face-to-face, real-time contacts)."}, {"id": 130, "d": "F", "t": "F.3", "q": "Which supervision arrangement meets BACB requirements for a month?", "o": ["At least two face-to-face, real-time contacts, with the supervisor observing the RBT with a client in at least one", "No contact if data look good", "One phone call", "All supervision via email"], "a": 0, "e": "Supervision must include at least 2 real-time face-to-face contacts per month (not phone/email), with observation during service delivery in at least one."}, {"id": 131, "d": "F", "t": "F.5", "q": "An RBT wants to tell a friend about a funny moment with a client at a restaurant, using the client's first name. This is:", "o": ["Required for rapport", "Okay if the friend doesn't know the family", "A breach of confidentiality", "Fine if it's positive"], "a": 2, "e": "Client information is confidential. Don't share identifying info in public or with people outside the treatment team."}, {"id": 132, "d": "F", "t": "F.5", "q": "Which practice BEST protects client confidentiality?", "o": ["Keeping data sheets in a locked location and using only approved, secure systems", "Discussing cases in the break room with all staff", "Texting client data from a personal phone with no security", "Leaving notes in the car"], "a": 0, "e": "Store, transmit, and dispose of client information according to legal (e.g., HIPAA) and agency requirements."}, {"id": 133, "d": "F", "t": "F.6", "q": "An RBT wants to post a photo of a client's art project on personal social media with the client's face visible. The RBT should:", "o": ["Not post it; client images/information may not be shared on personal social media", "Ask the client (a child) for permission", "Post it but blur the background", "Post it — it's positive"], "a": 0, "e": "Public statements and social media: RBTs don't share client information or images; even with good intentions this violates privacy."}, {"id": 134, "d": "F", "t": "F.6", "q": "Which public statement is appropriate for an RBT?", "o": ["Accurately stating their credential as a Registered Behavior Technician", "Advertising themselves as a 'behavior analyst'", "Claiming they can cure autism", "Posting client testimonials"], "a": 0, "e": "RBTs must accurately represent their credential and avoid false or misleading claims."}, {"id": 135, "d": "F", "t": "F.7", "q": "A client's parent asks the RBT to babysit on weekends for extra pay. The BEST response is:", "o": ["Accept only if it's under 4 hours", "Accept — it's good money", "Politely decline because it creates a multiple relationship, and inform the supervisor", "Accept if it's not billed"], "a": 2, "e": "Multiple relationships (e.g., babysitting a client) create conflicts of interest and risk harm. Decline and discuss with your supervisor."}, {"id": 136, "d": "F", "t": "F.7", "q": "A client's caregiver sends the RBT a friend request on personal social media. The RBT should:", "o": ["Decline/ignore and maintain professional boundaries, consulting the supervisor as needed", "Accept but not post", "Accept and message about sessions", "Accept to build rapport"], "a": 0, "e": "Social media connections with clients/families are multiple relationships that can blur professional boundaries."}, {"id": 137, "d": "F", "t": "F.8", "q": "At the end of the year, a family offers the RBT a $100 gift card as thanks. Per the RBT Ethics Code, the RBT should:", "o": ["Accept it", "Accept and split with the supervisor", "Politely decline, because the code limits gifts by monetary value; check the current code and agency policy", "Accept and not tell anyone"], "a": 2, "e": "The BACB ethics code's gift guidelines (F.8) include a monetary limit to prevent conflicts of interest. A $100 gift card is likely over that limit, so decline politely and check the current code and agency policy."}, {"id": 138, "d": "F", "t": "F.9", "q": "Which behavior shows good interpersonal and professional skills?", "o": ["Communicating respectfully with families, being on time, and dressing per agency policy", "Arguing with caregivers", "Arriving late regularly", "Using your phone during sessions"], "a": 0, "e": "Professionalism includes punctuality, respectful communication, and appropriate appearance and conduct."}, {"id": 139, "d": "F", "t": "F.10", "q": "A family's cultural practices differ from the RBT's own. Showing cultural humility means the RBT:", "o": ["Encourages the family to adopt the RBT's practices", "Ignores culture entirely", "Refuses to work with the family", "Reflects on personal biases, respects the family's values, and seeks supervisor guidance as needed"], "a": 3, "e": "Cultural humility is ongoing self-reflection, identifying personal biases, and responding respectfully to clients' cultures."}, {"id": 140, "d": "F", "t": "F.1", "q": "An RBT is charged with a crime. According to BACB requirements, the RBT must:", "o": ["Never report it", "Wait to see if convicted", "Self-report to the BACB within 30 days (and inform their supervisor)", "Report only at renewal"], "a": 2, "e": "Legal charges, investigations, and certain other events must be self-reported to the BACB within 30 days."}, {"id": 141, "d": "F", "t": "F.1", "q": "An RBT sees a coworker falsifying session data. What should the RBT do?", "o": ["Address it per the code — typically by bringing it to the supervisor/appropriate authority", "Copy the coworker", "Ignore it", "Post about it online"], "a": 0, "e": "Integrity requires acting on possible ethics violations, usually by consulting the supervisor and following reporting requirements."}, {"id": 142, "d": "F", "t": "F.3", "q": "Which action is OUTSIDE the scope of an RBT?", "o": ["Implementing a skill-acquisition plan", "Independently designing a behavior intervention plan", "Collecting data", "Reporting progress to the supervisor"], "a": 1, "e": "Designing plans and interpreting assessments are supervisor responsibilities; RBTs implement under supervision."}, {"id": 143, "d": "F", "t": "F.3", "q": "An RBT is offered a private, cash-only client outside of their agency and without a supervisor. The RBT should:", "o": ["Accept only on weekends", "Accept and keep it quiet", "Accept if the parent agrees", "Decline — RBTs cannot provide services without the required supervision"], "a": 3, "e": "RBTs may only provide behavior-technician services under the direction of a qualified supervisor."}, {"id": 144, "d": "F", "t": "F.5", "q": "A parent asks the RBT for another client's progress so she can compare. The RBT should:", "o": ["Share if the parent is a friend", "Share general details", "Share only data, not names", "Decline — other clients' information is confidential"], "a": 3, "e": "Never disclose information about other clients without proper consent."}, {"id": 145, "d": "F", "t": "F.1", "q": "Which action BEST reflects 'benefit others' and putting the client's interests first?", "o": ["Skipping data to save time", "Choosing activities the RBT prefers", "Extending sessions to bill more hours", "Implementing the plan with fidelity and reporting concerns that affect the client's welfare"], "a": 3, "e": "Benefiting others means prioritizing client welfare and effective, honest service delivery."}, {"id": 146, "d": "F", "t": "F.6", "q": "A local reporter asks an RBT for comments about a client's progress for a story. The RBT should:", "o": ["Share general success stories with names", "Post on social media instead", "Decline and refer the request to the supervisor/agency", "Give the interview using initials only"], "a": 2, "e": "Public statements about clients require consent and are handled by the agency/supervisor; protect confidentiality."}, {"id": 147, "d": "C", "t": "C.1", "q": "An RBT changes the size of a reinforcer (a small piece versus a large piece of a cookie) to find the amount the client responds to best. Which reinforcement dimension is being adjusted?", "o": ["Contingency", "Immediacy", "Magnitude", "Schedule"], "a": 2, "e": "Magnitude is the amount or size of reinforcement. The TCO (C.1) lists magnitude, intensity, and variety as reinforcement dimensions."}, {"id": 148, "d": "D", "t": "D.6", "q": "After a punishment procedure is used, a child becomes upset and begins escaping from the RBT more often. Which secondary effect of punishment is this?", "o": ["Spontaneous recovery", "Extinction burst", "Resurgence", "Escape and avoidance"], "a": 3, "e": "Punishment can produce escape, avoidance, and emotional responding. The TCO (D.6) lists these as secondary effects."}, {"id": 149, "d": "F", "t": "F.4", "q": "A supervisor wants an RBT to learn a new data-collection procedure. Which combination of practices is most effective for training?", "o": ["A single lecture", "Email feedback each week", "Written handout only", "Instruction, modeling, rehearsal, and feedback, followed by observation of service delivery"], "a": 3, "e": "The TCO (F.4) lists effective supervision practices: training with instruction, modeling, rehearsal, and feedback, plus observation of service delivery."}, {"id": 150, "d": "F", "t": "F.4", "q": "During supervision, the supervisor models how to deliver a prompt, then has the RBT practice it while giving immediate feedback. This best illustrates:", "o": ["Extinction", "Naturalistic teaching", "Modeling and rehearsal with feedback", "Negative reinforcement"], "a": 2, "e": "Modeling, rehearsal, and feedback are core supervisory training practices under F.4."}, {"id": 151, "d": "F", "t": "F.4", "q": "Which supervision activity best supports an RBT's competence in a skill the RBT has not yet demonstrated?", "o": ["Observation of the RBT delivering services, with feedback afterward", "Waiting until the annual renewal", "Reviewing a past session note by email only", "Having a peer guess the answer"], "a": 0, "e": "Observing service delivery and giving feedback is an effective supervision practice listed under F.4."}, {"id": 152, "d": "E", "t": "E.2", "q": "An RBT sees a data irregularity in a teammate's records. Following the chain of command, what should she do first?", "o": ["Wait for the monthly meeting", "Correct the records herself", "Report it promptly to her supervisor", "Post about it in the staff group chat"], "a": 2, "e": "E.2 covers promptly seeking clinical direction from a supervisor, including data irregularities and the chain of command."}, {"id": 153, "d": "A", "t": "A.6", "q": "An RBT is recording data on how often a client engages in aggression. The client engaged in 15 occurrences of aggression during the 90-minute session. What should the RBT record as the response rate per hour for aggression in that session?", "o": ["10", "15", "5", "25"], "a": 0, "e": "Official BACB sample question (RBT Handbook p. 8). 15 occurrences ÷ 1.5 hours = 10 per hour. Rate = count ÷ time."}, {"id": 154, "d": "F", "t": "F.5", "q": "While out to dinner, an RBT's friend, Alex, speaks to the RBT about a family with whom the RBT works. Alex says the family attends their church and complains that their child screams throughout the service. Alex then asks the RBT if they think the child uses ABA services. What is the BEST way for the RBT to respond?", "o": ["Tell Alex that the child is a client, but that they are unable to share details.", "Explain to Alex that they are working with the child and remind them not to tell anyone.", "Remind Alex that they are unable to comment on whether someone is a client due to confidentiality laws.", "Confide in Alex that they should not talk about the child, but can share information about the family members."], "a": 2, "e": "Official BACB sample question (RBT Handbook p. 8). Confidentiality covers even confirming whether someone is a client, so the RBT should neither confirm nor share any details."}, {"id": 155, "d": "D", "t": "D.3", "q": "An RBT is instructed to provide a reinforcer every time a student raises their hand, rather than shouting out in class. If the student shouts out, the RBT ignores the behavior. Which differential reinforcement procedure is the RBT implementing?", "o": ["DRA", "DRI", "DRO", "DRL"], "a": 0, "e": "Official BACB sample question (RBT Handbook p. 8). Reinforcing an alternative behavior (hand-raising) while withholding reinforcement for the problem behavior is DRA."}], "mock": [147, 98, 106, 131, 144, 150, 66, 152, 146, 88, 101, 36, 9, 16, 38, 46, 132, 115, 77, 23, 114, 71, 91, 27, 102, 118, 24, 49, 42, 121, 73, 14, 86, 79, 43, 117, 129, 25, 33, 148, 84, 75, 69, 82, 136, 57, 11, 48, 61, 39, 87, 26, 126, 109, 135, 8, 6, 50, 70, 145, 68, 19, 67, 10, 89, 154, 85, 30, 28, 125, 41, 153, 72, 20, 47, 116, 31, 113, 99, 108, 105, 141, 122, 15, 92], "pilot": [26, 89, 148, 47, 113, 108, 77, 11, 92, 154], "blueprint": [["A", "Data Collection & Graphing", 13, 17, ["A.1 Implement continuous measurement (frequency, duration, latency, interresponse time)", "A.2 Implement discontinuous measurement (partial and whole interval, momentary time sampling)", "A.3 Implement permanent product recording", "A.4 Enter data and update graphs", "A.5 Describe behavior and environment in observable, measurable terms", "A.6 Calculate and summarize data (rate, mean duration, percentage)", "A.7 Identify trends in graphed data", "A.8 Describe risks of unreliable data collection and poor procedural fidelity"]], ["B", "Behavior Assessment", 8, 11, ["B.1 Conduct preference assessments (multiple stimulus, paired stimulus, free operant)", "B.2 Participate in assessments of skill strengths and deficits (curriculum-based, developmental, social skills)", "B.3 Participate in functional assessment components (descriptive assessment, functional analysis)"]], ["C", "Behavior Acquisition", 19, 25, ["C.1 Implement positive and negative reinforcement (magnitude, intensity, variety; immediate, contingent, scheduled)", "C.2 Establish and use conditioned reinforcers", "C.3 Implement discrete-trial teaching", "C.4 Implement naturalistic teaching (incidental teaching, natural environment training)", "C.5 Implement task-analyzed chaining (forward, backward, total task)", "C.6 Implement discrimination training", "C.7 Implement stimulus and response prompts with fading (errorless, least-to-most, stimulus fading, time delay)", "C.8 Implement generalization procedures across settings, people, and stimuli", "C.9 Distinguish between maintenance and acquisition procedures", "C.10 Implement shaping", "C.11 Implement token economies"]], ["D", "Behavior Reduction", 14, 19, ["D.1 Identify common functions of behavior", "D.2 Implement antecedent interventions (NCR, high-probability request sequences, demand fading)", "D.3 Implement differential reinforcement (DRO, DRA, DRI, DRL, FCT)", "D.4 Implement extinction procedures", "D.5 Implement positive and negative punishment procedures (e.g., time-out)", "D.6 Describe secondary effects of extinction and punishment (burst, response variation, resurgence, emotional responding, escape and avoidance)", "D.7 Implement crisis and emergency procedures"]], ["E", "Documentation & Reporting", 10, 13, ["E.1 Promptly communicate concerns and suggestions from the intervention team to a supervisor", "E.2 Promptly seek and prioritize clinical direction from a supervisor (training needs, data irregularities, chain of command)", "E.3 Promptly report variables that might affect progress (illness, medication, schedule changes)", "E.4 Objectively communicate what occurred in the session, following legal, regulatory, and workplace requirements"]], ["F", "Ethics", 11, 15, ["F.1 Identify and apply core principles of the BACB ethics code for RBTs", "F.2 Provide services only after demonstrating competence", "F.3 Provide services only under ongoing supervision by BACB-qualified supervisors", "F.4 Identify effective supervision practices (instruction, modeling, rehearsal, feedback, observation)", "F.5 Comply with rules for collecting, using, storing, protecting, and disclosing confidential information", "F.6 Comply with rules for public statements about professional activities (social media, credentials, outcomes)", "F.7 Identify types of and risks from multiple relationships, and how to mitigate unavoidable ones", "F.8 Follow the BACB ethics code's gift-giving and gift-receiving guidelines", "F.9 Apply interpersonal and professional skills (accepting feedback, active listening, collaborating)", "F.10 Practice ongoing cultural humility and responsiveness"]]], "plan": [["Week 1 — Foundations + Measurement", [["Day 1", "Take a 25-question baseline drill (all domains) on the site. Read the cheat sheet once, top to bottom. Note your weakest domain."], ["Day 2", "Domain A: continuous measurement (frequency, rate, duration, latency, IRT). Make 10 flashcards from your own examples. Drill A (15 Qs)."], ["Day 3", "Domain A: discontinuous measurement (partial/whole interval, MTS) + permanent product. Memorize: partial OVERestimates, whole UNDERestimates."], ["Day 4", "Domain A: calculations (rate, %, mean duration, % of intervals) + trend/level/variability on graphs. Do 10 math problems by hand."], ["Day 5", "Domain A: operational definitions, data reliability (IOA), procedural fidelity. Drill A to ≥85%."], ["Day 6", "Domain B: preference assessments (MSWO, MSW, paired, single, free-operant) + skills assessments. Drill B."], ["Day 7", "Domain B: functional assessment (indirect, ABC/descriptive, FA conditions). Review all week-1 flashcards. Drill A+B mixed."]]], ["Week 2 — Behavior Acquisition (25% of exam)", [["Day 8", "Reinforcement: positive vs negative, immediacy, schedules (FR, VR, FI, VI, CRF). Make a 2×2 reinforcement/punishment grid from memory."], ["Day 9", "Conditioned vs unconditioned vs generalized reinforcers, pairing, motivating operations (deprivation/satiation)."], ["Day 10", "DTT (SD → prompt → response → consequence → ITI), error correction, interspersal. Naturalistic teaching / incidental teaching."], ["Day 11", "Task analysis + forward, backward, total-task chaining. Shaping vs chaining. Drill C."], ["Day 12", "Discrimination (SD vs S-delta, stimulus control). Prompts: response vs stimulus; most-to-least, least-to-most, time delay; fading."], ["Day 13", "Generalization (stimulus/response, multiple exemplars) vs maintenance (thin schedule, probes). Token economies."], ["Day 14", "Full Domain C drill (all questions) to ≥85%. Re-read cheat-sheet sections A–C."]]], ["Week 3 — Behavior Reduction + Documentation", [["Day 15", "Functions of behavior (SEAT: Sensory, Escape, Attention, Tangible). Practice naming the function in 20 scenarios."], ["Day 16", "Antecedent interventions: NCR, high-p sequence, demand fading, choice, visual schedules."], ["Day 17", "Differential reinforcement: DRA, DRI, DRO, DRL, FCT. Write one example of each."], ["Day 18", "Extinction (attention, escape, sensory) + secondary effects: burst, spontaneous recovery, resurgence, emotional responding, response variation."], ["Day 19", "Punishment: positive vs negative, response cost, time-out (exclusionary vs non). Crisis procedures. Drill D."], ["Day 20", "Domain E: objective session notes, reporting variables (meds, sleep, illness, home changes), seeking/prioritizing supervisor direction. Drill E."], ["Day 21", "Mixed drill D+E. Take the printable 30-question quiz on paper, timed (32 min). Grade with the key."]]], ["Week 4 — Ethics + Full Mock Exams", [["Day 22", "Domain F: 4 core principles, competence, supervision (5% / 2 contacts), scope of practice. Drill F. (Verified: RBT Handbook pp. 16–17.)"], ["Day 23", "Domain F: confidentiality, social media/public statements, multiple relationships, gifts, cultural humility, 30-day self-reporting (verified: RBT Handbook p. 23). Drill F to ≥90%."], ["Day 24", "FULL 85-question mock exam, 90-minute timer, no notes. Review EVERY missed question and its explanation."], ["Day 25", "Re-study the 2 weakest domains from the mock results (the site shows your % by domain). Redo their drills."], ["Day 26", "Flashcards: run the full deck until you get 100% in one pass."], ["Day 27", "Second full mock (paper PDF version). Target ≥85% before test day."], ["Day 28", "Light review of cheat sheet only. Confirm Pearson VUE appointment, ID, route, and arrival time. Sleep."]]]], "testday": ["Exam: 85 multiple-choice questions (75 scored + 10 unscored pilot) in 90 minutes at a Pearson VUE center. You won't know which are pilot items — answer all.", "Pace: about 1 minute per question. Flag hard ones, move on, and come back. Never leave a blank.", "Read the LAST sentence of the question first ('What should the RBT do FIRST?'). Words like FIRST, BEST, MOST, NOT change the answer.", "When an answer involves the RBT designing, changing, or interpreting something alone, it's usually wrong. 'Implement as written + tell the supervisor' is usually right.", "Safety first: if a choice addresses immediate risk of harm, it's usually the FIRST step.", "Eliminate answers with subjective language (angry, lazy, manipulative) in data/notes questions.", "Bring ONE valid government-issued ID whose name matches your BACB portal account exactly. Arrive about 30 minutes early: after 30 minutes late you are turned away and fees are forfeited. No phones, notes, bags, or food in the testing room (RBT Handbook pp. 10–12)."], "cheat": [["Reinforcement & Punishment (the 2×2)", "\n<table><tr><th><\/th><th>Behavior ↑ (Reinforcement)<\/th><th>Behavior ↓ (Punishment)<\/th><\/tr>\n<tr><th>+ Add stimulus (Positive)<\/th><td>Positive reinforcement — praise after a correct answer<\/td><td>Positive punishment — reprimand, overcorrection<\/td><\/tr>\n<tr><th>− Remove stimulus (Negative)<\/th><td>Negative reinforcement — break from work after asking<\/td><td>Negative punishment — response cost, time-out<\/td><\/tr><\/table>\n<p><b>Positive/negative = add/remove. Reinforcement/punishment = behavior goes up/down.<\/b> Always judged by the effect on FUTURE behavior.<\/p>"], ["Measurement — Continuous", "<ul>\n<li><b>Frequency/Count<\/b> — number of times (tally).<\/li>\n<li><b>Rate<\/b> — count ÷ time (use when session lengths differ). 12 hits in 30 min = 0.4/min.<\/li>\n<li><b>Duration<\/b> — onset to offset. Mean duration = total time ÷ # episodes.<\/li>\n<li><b>Latency<\/b> — SD/instruction → START of response.<\/li>\n<li><b>IRT<\/b> — END of one response → START of next.<\/li>\n<li><b>Trial-by-trial / % correct<\/b> — correct ÷ total × 100.<\/li><\/ul>"], ["Measurement — Discontinuous & Product", "<ul>\n<li><b>Partial interval<\/b> — any time in interval → <b>OVERestimates<\/b>; use for behaviors to ↓.<\/li>\n<li><b>Whole interval<\/b> — entire interval → <b>UNDERestimates<\/b>; use for behaviors to ↑ (on-task).<\/li>\n<li><b>Momentary time sampling<\/b> — only at the moment the interval ends.<\/li>\n<li>Report interval data as <b>% of intervals<\/b>.<\/li>\n<li><b>Permanent product<\/b> — measure the outcome after (worksheets, dishes washed). Don't need to watch; may not know who made it.<\/li><\/ul>"], ["Graphs & Data Quality", "<ul>\n<li>x-axis = time/sessions; y-axis = behavior measure; phase-change li
