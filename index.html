ne = new condition.<\/li>\n<li><b>Level<\/b> (how high), <b>Trend<\/b> (direction: increasing, decreasing, zero), <b>Variability<\/b> (bounce).<\/li>\n<li><b>Operational definition<\/b>: observable + measurable, so two people would agree. No feelings/labels.<\/li>\n<li><b>IOA<\/b> = two independent observers agree → reliable data.<\/li>\n<li><b>Procedural fidelity<\/b> = implementing the plan exactly as written.<\/li>\n<li>Bad data / poor fidelity → wrong treatment decisions. Record in real time; enter & graph promptly.<\/li><\/ul>"], ["Preference Assessments", "<ul>\n<li><b>Single stimulus<\/b> — one item at a time; for learners who can't choose.<\/li>\n<li><b>Paired stimulus (forced choice)<\/b> — 2 at a time, every item paired with every other.<\/li>\n<li><b>MSW<\/b> — array; chosen item <i>replaced<\/i>.<\/li>\n<li><b>MSWO<\/b> — array; chosen item <i>removed<\/i> → ranked hierarchy. Fast.<\/li>\n<li><b>Free operant<\/b> — free access, measure duration of engagement; nothing removed → little problem behavior.<\/li>\n<li>Preference ≠ reinforcer until it increases behavior. Preferences change (MOs) → reassess often.<\/li><\/ul>"], ["Functional Assessment", "<ul>\n<li><b>Indirect<\/b> — interviews, rating scales (QABF, MAS, FAST).<\/li>\n<li><b>Descriptive<\/b> — direct observation without manipulation: <b>ABC<\/b> data, scatterplot.<\/li>\n<li><b>Functional analysis<\/b> — experimental manipulation: attention, demand (escape), alone, tangible, play/control (control = free reinforcers, no demands, low behavior).<\/li>\n<li>RBT role: carry out components as directed. BCBA designs & interprets.<\/li>\n<li><b>SEAT<\/b> functions: Sensory/automatic, Escape, Attention, Tangible.<\/li><\/ul>"], ["Reinforcement Schedules & Reinforcers", "<ul>\n<li><b>CRF/FR1<\/b> — every response; best for NEW skills (acquisition).<\/li>\n<li><b>FR<\/b> fixed # responses · <b>VR<\/b> average # (high steady rates) · <b>FI<\/b> first response after fixed time (scallop) · <b>VI<\/b> first response after varying time.<\/li>\n<li>Intermittent schedules → more resistant to extinction → good for maintenance.<\/li>\n<li><b>Unconditioned<\/b> (food, water) · <b>Conditioned<\/b> (praise — learned via <b>pairing<\/b>) · <b>Generalized conditioned<\/b> (tokens, money).<\/li>\n<li><b>Establishing operation<\/b> (deprivation) ↑ value · <b>Abolishing operation<\/b> (satiation) ↓ value.<\/li>\n<li>Deliver reinforcement <b>immediately<\/b> and <b>contingently<\/b>.<\/li><\/ul>"], ["Teaching Procedures", "<ul>\n<li><b>DTT<\/b>: SD → (prompt) → response → consequence → intertrial interval. Error correction + interspersal of mastered items.<\/li>\n<li><b>NET / incidental<\/b>: natural setting, learner motivation, natural reinforcers → better generalization.<\/li>\n<li><b>Task analysis<\/b> breaks a skill into steps. <b>Forward<\/b> chaining = first step first. <b>Backward<\/b> = last step first (immediate reinforcement). <b>Total task<\/b> = all steps every time.<\/li>\n<li><b>Shaping<\/b> = reinforce successive approximations of ONE behavior. Chaining = link MANY behaviors.<\/li>\n<li><b>Discrimination<\/b>: reinforce in presence of SD, not S-delta → <b>stimulus control<\/b>.<\/li>\n<li><b>Token economy<\/b>: target behaviors + tokens + backup reinforcers + exchange rate.<\/li><\/ul>"], ["Prompts & Fading", "<ul>\n<li><b>Response prompts<\/b>: physical (full/partial), model, gestural, verbal.<\/li>\n<li><b>Stimulus prompts<\/b>: positional, size, color, within-stimulus changes.<\/li>\n<li><b>Most-to-least<\/b> — start full help, fade (errorless). <b>Least-to-most<\/b> — start with chance to respond, add help as needed.<\/li>\n<li><b>Time delay<\/b>: constant (0s → fixed delay) or progressive (0, 2, 4, 6s...).<\/li>\n<li>Fade prompts to avoid <b>prompt dependence<\/b> and transfer control to the natural SD.<\/li><\/ul>"], ["Generalization vs Maintenance", "<ul>\n<li><b>Stimulus generalization<\/b> — same behavior with new people/settings/materials.<\/li>\n<li><b>Response generalization<\/b> — new, untrained forms of the behavior.<\/li>\n<li>Promote with multiple exemplars, varied settings/people, natural reinforcers.<\/li>\n<li><b>Maintenance<\/b> — behavior continues after teaching ends. Thin to intermittent reinforcement, probe/review mastered targets.<\/li>\n<li><b>Acquisition<\/b> = learning new skill (dense reinforcement, prompting).<\/li><\/ul>"], ["Antecedent & Differential Reinforcement", "<ul>\n<li><b>NCR<\/b> — reinforcer on a time schedule regardless of behavior.<\/li>\n<li><b>High-p sequence<\/b> — easy requests first → momentum → hard request.<\/li>\n<li><b>Demand fading<\/b> — remove demands, gradually add back.<\/li>\n<li>Other: choices, visual schedules, priming, warnings before transitions.<\/li>\n<li><b>DRA<\/b> alternative behavior · <b>DRI<\/b> incompatible behavior · <b>DRO<\/b> absence of behavior for an interval · <b>DRL<\/b> lower rate (behavior OK, just too often).<\/li>\n<li><b>FCT<\/b> — teach a communication response with the SAME function.<\/li><\/ul>"], ["Extinction & Its Side Effects", "<ul>\n<li><b>Extinction<\/b> = stop delivering the reinforcer that maintained the behavior (attention → planned ignoring; escape → follow through on demand; sensory → block/mask sensation).<\/li>\n<li><b>Extinction burst<\/b> — temporary ↑ when extinction starts.<\/li>\n<li><b>Spontaneous recovery<\/b> — old behavior briefly returns after time.<\/li>\n<li><b>Resurgence<\/b> — old behavior returns when the newer replacement behavior is put on extinction.<\/li>\n<li>Also: response variation, emotional responding, aggression.<\/li>\n<li>Inconsistency = intermittent reinforcement = harder to extinguish.<\/li><\/ul>"], ["Punishment & Crisis", "<ul>\n<li><b>Response cost<\/b> — lose a reinforcer (tokens, minutes).<\/li>\n<li><b>Time-out<\/b> — removal of access to reinforcement. Nonexclusionary (contingent observation) vs exclusionary (leave area). Works only if time-in is reinforcing; can backfire for escape.<\/li>\n<li>RBT implements punishment ONLY as written by the supervisor, after training. Reinforcement-based procedures first.<\/li>\n<li><b>Crisis<\/b>: follow the written crisis plan/agency protocol → safety first → document → notify supervisor promptly.<\/li><\/ul>"], ["Documentation & Reporting", "<ul>\n<li>Notes: objective, observable, timely, accurate. No opinions/labels.<\/li>\n<li>Report variables: illness, meds, sleep, diet, family/home changes, cancellations, implementation at home.<\/li>\n<li>Pass caregiver/teacher concerns to the supervisor — don't change programs yourself.<\/li>\n<li>Unsure? Ask the supervisor BEFORE implementing. Prioritize safety/harm issues first.<\/li>\n<li>Correct records per policy; never falsify. Incidents → incident report + notify supervisor.<\/li>\n<li>Parent clinical questions (prognosis, diagnosis, plan changes) → refer to supervisor.<\/li><\/ul>"], ["Ethics — Must-Know", "<ul>\n<li><b>4 core principles<\/b>: Benefit others · Treat others with compassion, dignity & respect · Behave with integrity · Ensure competence.<\/li>\n<li><b>Verified against the RBT Handbook (Updated 10/2026):<\/b> 5% of monthly service hours, with at least two face-to-face, real-time contacts (not phone or email) and observation in at least one (pp. 16–17). Self-reports within 30 days (p. 23).<\/li>\n<li><b>Supervision<\/b>: ≥ <b>5%<\/b> of service hours each calendar month; ≥ <b>2 face-to-face, real-time contacts<\/b> (not phone/email); supervisor observes you with a client in ≥1; ≥1 individual. No supervisor = can't practice.<\/li>\n<li>Competence: get trained before doing a procedure. Stay in scope — RBTs implement, don't design.<\/li>\n<li>Confidentiality: HIPAA/agency rules; no client info in public or on personal devices/social media.<\/li>\n<li>Public statements: represent credential accurately; no testimonials or client photos.<\/li>\n<li>Multiple relationships: no babysitting, friending, dating, business with clients/families.<\/li>\n<li>Gifts: follow the ethics code's gift guidelines (F.8). The code sets a monetary limit; check the current code and agency policy.<\/li>\n<li><b>Self-report to the BACB within 30 days<\/b> (legal charges, investigations, etc.).<\/li>\n<li>Effective supervision practices (F.4): instruction, modeling, rehearsal, feedback, and observation of service delivery.<\/li>\n<li>Cultural humility: identify your biases, respect family values, ask supervisor.<\/li><\/ul>"]], "flash": [["Positive reinforcement", "Stimulus ADDED after behavior → behavior INCREASES."], ["Negative reinforcement", "Stimulus REMOVED after behavior → behavior INCREASES (e.g., escape)."], ["Positive punishment", "Stimulus ADDED after behavior → behavior DECREASES."], ["Negative punishment", "Stimulus REMOVED after behavior → behavior DECREASES (response cost, time-out)."], ["Frequency / count", "Number of times a behavior occurs."], ["Rate", "Count ÷ time. Use when observation periods differ."], ["Duration", "Time from onset to offset of a behavior."], ["Latency", "Time from the SD/instruction to the START of the response."], ["Inter-response time (IRT)", "Time from the END of one response to the START of the next."], ["Partial-interval recording", "Score if behavior occurs at ANY time in interval. Overestimates. For behaviors to decrease."], ["Whole-interval recording", "Score only if behavior lasts the ENTIRE interval. Underestimates. For behaviors to increase."], ["Momentary time sampling", "Score only if behavior is occurring at the moment the interval ends."], ["Permanent product", "Measuring the lasting outcome of behavior after it occurs."], ["Operational definition", "Observable, measurable description of behavior so observers agree."], ["Trend", "Overall direction of the data path (increasing, decreasing, zero)."], ["Level", "Where data points fall on the y-axis (high/low)."], ["Variability", "How much data points differ from one another."], ["Interobserver agreement (IOA)", "Two independent observers' data compared to check reliability."], ["Procedural fidelity", "Implementing the procedure exactly as written (treatment integrity)."], ["Single-stimulus PA", "One item presented at a time; record approach/engagement."], ["Paired-stimulus PA", "Two items at a time; each paired with every other item."], ["MSWO", "Multiple stimulus WITHOUT replacement — chosen item removed from array."], ["MSW", "Multiple stimulus WITH replacement — chosen item returned to array."], ["Free-operant PA", "Free access to items; measure engagement duration; nothing removed."], ["Indirect assessment", "Interviews/rating scales (QABF, MAS, FAST)."], ["Descriptive assessment", "Direct observation without manipulation (ABC data, scatterplot)."], ["Functional analysis", "Experimental manipulation of conditions (attention, demand, alone, play) to identify function."], ["ABC", "Antecedent – Behavior – Consequence."], ["Functions of behavior (SEAT)", "Sensory/automatic, Escape, Attention, Tangible."], ["Unconditioned reinforcer", "Needs no learning: food, water, warmth."], ["Conditioned reinforcer", "Learned through pairing with other reinforcers: praise, tokens."], ["Generalized conditioned reinforcer", "Paired with many backups: tokens, money."], ["Pairing", "Presenting a neutral stimulus with a reinforcer so it becomes a conditioned reinforcer."], ["Establishing operation", "Increases the value of a reinforcer (e.g., deprivation)."], ["Abolishing operation", "Decreases the value of a reinforcer (e.g., satiation)."], ["Continuous reinforcement (CRF)", "Every correct response reinforced — best for acquisition."], ["Fixed ratio (FR)", "Reinforce after a set number of responses."], ["Variable ratio (VR)", "Reinforce after an average number of responses — high steady rates."], ["Fixed interval (FI)", "First response after a set time is reinforced — scallop pattern."], ["Variable interval (VI)", "First response after an average time is reinforced."], ["Discrete-trial teaching", "SD → prompt → response → consequence → intertrial interval."], ["Naturalistic teaching (NET)", "Teaching in natural context using learner's motivation & natural reinforcers."], ["Task analysis", "Breaking a complex skill into smaller sequential steps."], ["Forward chaining", "Teach the first step first, then add steps."], ["Backward chaining", "Teach the last step first; learner finishes the chain and gets reinforced."], ["Total-task chaining", "Learner is taught all steps in every session."], ["Shaping", "Reinforcing successive approximations toward a target behavior."], ["SD (discriminative stimulus)", "Signals reinforcement is available for a response."], ["S-delta", "Signals reinforcement is NOT available."], ["Stimulus control", "Behavior reliably occurs in the presence of the SD and not the S-delta."], ["Response prompts", "Physical, model, gestural, verbal."], ["Stimulus prompts", "Changes to the stimulus: position, size, color."], ["Most-to-least prompting", "Start with most intrusive prompt and fade. Errorless."], ["Least-to-most prompting", "Start with least assistance; increase only as needed."], ["Time delay", "Delay between SD and prompt — constant or progressive."], ["Stimulus generalization", "Behavior occurs with untrained people, settings, or materials."], ["Maintenance", "Behavior continues after intervention is withdrawn."], ["Token economy", "Tokens earned for target behaviors, exchanged for backup reinforcers."], ["NCR", "Noncontingent reinforcement — reinforcer delivered on a time schedule regardless of behavior."], ["High-p request sequence", "Several easy requests before a difficult one (behavioral momentum)."], ["Demand fading", "Remove demands then gradually reintroduce them."], ["DRA", "Reinforce an appropriate ALTERNATIVE behavior."], ["DRI", "Reinforce a behavior INCOMPATIBLE with the problem behavior."], ["DRO", "Reinforce the ABSENCE of the problem behavior for an interval."], ["DRL", "Reinforce LOWER rates of a behavior that's OK but too frequent."], ["FCT", "Functional communication training — teach communication with same function as problem behavior."], ["Extinction", "Withholding the reinforcer that maintained a behavior."], ["Extinction burst", "Temporary increase in behavior when extinction begins."], ["Spontaneous recovery", "Extinguished behavior reappears briefly after time passes."], ["Resurgence", "Old behavior returns when the newer behavior is placed on extinction."], ["Response cost", "Loss of a reinforcer contingent on behavior (negative punishment)."], ["Time-out", "Removal of access to reinforcement for a period; needs a reinforcing time-in."], ["RBT supervision minimum", "5% of monthly service hours; ≥2 face-to-face real-time contacts (not phone/email); observed with client in ≥1. RBT Handbook pp. 16–17."], ["RBT Ethics core principles", "Benefit others; compassion, dignity & respect; integrity; competence."], ["BACB self-report window", "Within 30 days of becoming aware (critical events, changes to personal information). RBT Handbook p. 23."], ["Multiple relationship", "Having another role with a client/family (friend, babysitter, business) — avoid."], ["Cultural humility", "Ongoing self-reflection on biases; respecting client culture and values."], ["Effective supervision practices (F.4)", "Instruction, modeling, rehearsal, feedback, and observation of service delivery."], ["Reinforcement dimensions (C.1)", "Magnitude (amount), intensity, and variety; delivered immediately, contingently, or on a schedule."], ["Secondary effects of punishment (D.6)", "Emotional responding, escape and avoidance, and other side effects."]], "pdfs": [["RBT-Study-Plan.pdf", "Study plan"], ["RBT-Cheat-Sheet.pdf", "Cheat sheet"], ["RBT-Full-Practice-Exam.pdf", "Full 85-Q exam + key"], ["RBT-Printable-Quiz.pdf", "30-Q quiz + key"]]};
const $ = s => document.querySelector(s);
const app = $('#app');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('rbt_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('rbt_'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = 'ABCD';
const domName = c => D.blueprint.find(b => b[0]===c)[1];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let timerId = null;

function route(){
  clearInterval(timerId);
  const h = (location.hash || '#home').slice(1).split('/');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#'+h[0]));
  ({home, plan, cheat, flash, drill, exam, files}[h[0]] || home)(h);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

  const best = exams.length ? Math.max(...exams.map(e=>e.pct)) : null;
  app.innerHTML = `
  <div class="card"><h2>Your progress</h2>
   <div class="grid">
    <div class="stat"><b>${done}/${totalDays}</b><span>study-plan days done</span></div>
    <div class="stat"><b>${exams.length}</b><span>full mock exams taken</span></div>
    <div class="stat"><b>${best===null?'—':best+'%'}</b><span>best mock score</span></div>
    <div class="stat"><b>${D.q.length}</b><span>practice questions</span></div>
   </div>
   <div class="row" style="margin-top:14px"><a class="btn" href="#exam">Start full mock exam</a><a class="btn ghost" href="#drill">Practice by domain</a></div>
  </div>

   <p class="muted">85 questions (75 scored + 10 unscored pilot) · 90 minutes · Pearson VUE. Your drill accuracy by domain is shown on each bar.</p>
   ${D.blueprint.map(b=>{ const s = hist[b[0]]||{c:0,t:0}; const p = s.t?Math.round(s.c/s.t*100):0;
     return `<div class="dom"><span class="tag">${b[0]}</span><div class="grow"><div><b>${b[1]}</b> <span class="muted">· ${b[2]} Qs · ${b[3]}%</span></div>
     <div class="bar"><i style="width:${p}%"></i></div><div class="muted" style="font-size:12px">${s.t?p+'% correct of '+s.t+' answered':'not practiced yet'}</div></div></div>`}).join('')}
  </div>
  <div class="card"><h2>Verified against the RBT Handbook</h2><p class="muted">Updated 10/2026 edition. Supervision: 5% of monthly service hours, at least two face-to-face, real-time contacts (not phone or email), observed in one (pp. 16–17). Self-reporting within 30 days (p. 23). Exam: one valid government ID; arrive 30 minutes early (pp. 10–11). Scoring: pass/fail, modified Angoff (p. 14). Source: <a href="https://www.bacb.com/rbt-handbook" target="_blank" rel="noopener">bacb.com/rbt-handbook</a>.</p></div>
  <div class="card"><h2>Test-day strategy</h2><ul>${D.testday.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="card"><h2>Printable PDFs</h2><p class="muted">Print or save to your phone.</p>
   <div class="row">${D.pdfs.map(p=>`<a class="btn ghost sm" href="pdfs/${p[0]}" target="_blank" rel="noopener">${p[1]}</a>`).join('')}</div></div>
  <div class="card"><h3>Detailed task list</h3>${D.blueprint.map(b=>`<details><summary>${b[0]}. ${b[1]}</summary><ul>${b[4].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`).join('')}
   <p class="muted" style="margin-top:10px">Always confirm details with the official <a href="https://www.bacb.com/rbt/" target="_blank" rel="noopener">BACB RBT page</a>, RBT Handbook and RBT Ethics Code (2.0).</p>
   <button class="btn ghost sm" onclick="if(confirm('Reset all saved progress on this device?')){['plan','domstats','exams','known'].forEach(k=>store.set(k,k==='exams'?[]:{}));route()}">Reset progress</button></div>`;
}

// ---------- PLAN ----------
function plan(){
  const st = store.get('plan', {});
  app.innerHTML = `<h2>4-week study plan</h2><p class="muted">About 60–90 minutes a day. Check off each day; progress is saved on this device.</p>` +
   D.plan.map((w,wi)=>`<div class="card"><h3>${esc(w[0])}</h3>${w[1].map((d,di)=>{const k=wi+'_'+di;return `<label class="chk ${st[k]?'done':''}"><input type="checkbox" data-k="${k}" ${st[k]?'checked':''}><span><b>${esc(d[0])}:</b> ${esc(d[1])}</span></label>`}).join('')}</div>`).join('');
  app.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { const s = store.get('plan',{}); s[cb.dataset.k] = cb.checked; store.set('plan', s); cb.parentElement.classList.toggle('done', cb.checked); });
}

// ---------- CHEAT ----------
function cheat(){
  app.innerHTML = `<h2>Cheat sheet</h2><p class="muted">The highest-yield concepts, terms and procedures.</p>` + D.cheat.map(c=>`<div class="card cs"><h3>${esc(c[0])}</h3>${c[1]}</div>`).join('');
}

// ---------- FLASHCARDS ----------
function flash(){
  let known = store.get('known', {});
  let mode = 'all', deck = shuffle(D.flash.map((f,i)=>i)), i = 0, back = false;
  function draw(){
    const list = mode==='unknown' ? deck.filter(x=>!known[x]) : deck;
    const nKnown = Object.values(known).filter(Boolean).length;
    if(!list.length){ app.innerHTML = `<h2>Flashcards</h2><div class="card"><p>🎉 You marked every card as known.</p><button class="btn" id="rs">Reset known cards</button></div>`; $('#rs').onclick=()=>{known={};store.set('known',known);draw()}; return; }
    if(i>=list.length) i=0;
    const f = D.flash[list[i]];
    app.innerHTML = `<h2>Flashcards</h2>
     <div class="row" style="margin-bottom:10px"><select id="m"><option value="all">All cards (${D.flash.length})</option><option value="unknown" ${mode==='unknown'?'selected':''}>Still learning (${D.flash.length-nKnown})</option></select><span class="pill">${i+1} / ${list.length}</span></div>
     <div class="card flash ${back?'back':''}" id="fc">${esc(back?f[1]:f[0])}</div>
     <p class="muted" style="text-align:center;margin-top:-6px">Tap the card to flip</p>
     <div class="row"><button class="btn ghost" id="pv">‹ Prev</button><button class="btn ghost grow" id="kn">${known[list[i]]?'✓ Known':'Mark known'}</button><button class="btn" id="nx">Next ›</button></div>
     <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="sh">Shuffle</button></div>`;
    $('#fc').onclick=()=>{back=!back;draw()};
    $('#nx').onclick=()=>{i=(i+1)%list.length;back=false;draw()};
    $('#pv').onclick=()=>{i=(i-1+list.length)%list.length;back=false;draw()};
    $('#kn').onclick=()=>{known[list[i]]=!known[list[i]];store.set('known',known);if(mode==='unknown'){back=false;} draw()};
    $('#sh').onclick=()=>{deck=shuffle(deck);i=0;back=false;draw()};
    $('#m').onchange=e=>{mode=e.target.value;i=0;back=false;draw()};
  }
  draw();
}

// ---------- DRILL ----------
function recordDom(dom, ok){ const s = store.get('domstats', {}); s[dom] = s[dom] || {c:0,t:0}; s[dom].t++; if(ok) s[dom].c++; store.set('domstats', s); }
function drill(h){
  const dom = h[1];
  if(!dom){
    app.innerHTML = `<h2>Practice by domain</h2><p class="muted">Instant feedback with explanations after every question.</p>
    <div class="card">${D.blueprint.map(b=>{const n=D.q.filter(q=>q.d===b[0]).length;return `<div class="dom"><span class="tag">${b[0]}</span><div class="grow"><b>${b[1]}</b><div class="muted">${n} questions</div></div><a class="btn sm" href="#drill/${b[0]}">Start</a></div>`}).join('')}
    <div class="dom"><span class="tag">★</span><div class="grow"><b>Mixed — all domains</b><div class="muted">25 random questions</div></div><a class="btn sm" href="#drill/MIX">Start</a></div>
    <div class="dom"><span class="tag">!</span><div class="grow"><b>Review my misses</b><div class="muted">${store.get('missed',[]).length} saved</div></div><a class="btn sm" href="#drill/MISS">Start</a></div></div>`;
    return;
  }
  let pool = dom==='MIX' ? shuffle(D.q).slice(0,25) : dom==='MISS' ? shuffle(D.q.filter(q=>store.get('missed',[]).includes(q.id))) : shuffle(D.q.filter(q=>q.d===dom));
  if(!pool.length){ app.innerHTML = `<div class="card"><p>No questions here yet. Missed questions are saved automatically as you practice.</p><a class="btn" href="#drill">Back</a></div>`; return; }
  let i = 0, score = 0, answered = false;
  function draw(){
    if(i>=pool.length){ const p=Math.round(score/pool.length*100);
      app.innerHTML = `<div class="card" style="text-align:center"><p class="muted">Drill complete</p><p class="big ${p>=80?'pass':'fail'}">${p}%</p><p>${score} of ${pool.length} correct</p><div class="row" style="justify-content:center"><a class="btn" href="#drill">More drills</a><button class="btn ghost" onclick="route()">Retry</button></div></div>`; return; }
    const q = pool[i];
    app.innerHTML = `<div class="row"><span class="tag">${q.d}</span><span class="muted grow">${esc(domName(q.d))} · ${q.t}</span><span class="pill">${i+1}/${pool.length} · ${score} ✓</span></div>
     <div class="card" style="margin-top:10px"><div class="q">${esc(q.q)}</div>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span>${esc(o)}</button>`).join('')}<div id="fb"></div></div>
     <div class="row"><a class="btn ghost" href="#drill">Exit</a><span class="grow"></span><button class="btn" id="nx" style="display:none">Next ›</button></div>`;
    answered = false;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if(answered) return; answered = true;
      const k = +b.dataset.k, ok = k===q.a; if(ok) score++;
      recordDom(q.d, ok);
      let m = store.get('missed', []); if(!ok && !m.includes(q.id)) m.push(q.id); if(ok && dom==='MISS') m = m.filter(x=>x!==q.id); store.set('missed', m);
      app.querySelectorAll('.opt').forEach((x,j)=>{ if(j===q.a) x.classList.add('right'); else if(j===k) x.classList.add('wrong'); });
      $('#fb').innerHTML = `<div class="exp"><b>${ok?'✓ Correct.':'✗ Not quite — answer '+L[q.a]+'.'}</b> ${esc(q.e)}</div>`;
      $('#nx').style.display='inline-block';
    });
    $('#nx').onclick = () => { i++; draw(); };
  }
  draw();
}

// ---------- EXAM ----------
function exam(h){
  let st = store.get('cur', null);
  if(h[1]==='start' || !st){
    if(h[1]!=='start'){
      const exams = store.get('exams', []);
      app.innerHTML = `<h2>Full mock exam</h2><div class="card"><p><b>85 questions · 90 minutes</b>: 75 scored (A 13 · B 8 · C 19 · D 14 · E 10 · F 11) plus 10 unscored pilot questions, as on the real exam. No feedback until you submit. Flag questions to revisit; pause the timer anytime (the real exam has no pause). Your exam is saved if you close the browser.</p>
      <div class="row"><a class="btn" href="#exam/start">Start new exam</a><label class="row muted"><input type="checkbox" id="shf"> shuffle question order</label></div></div>
      ${exams.length?`<div class="card"><h3>Past attempts</h3>${exams.slice().reverse().map(e=>`<div class="dom"><div class="grow">${new Date(e.at).toLocaleString()}</div><b class="${e.pct>=80?'pass':'fail'}">${e.pct}%</b></div>`).join('')}</div>`:''}`;
      $('#shf').checked = store.get('shf', false); $('#shf').onchange = e => store.set('shf', e.target.checked);
      return;
    }
    const ids = D.mock.slice(); st = {ids: store.get('shf',false)?shuffle(ids):ids, ans:{}, flag:{}, i:0, end: Date.now()+90*60*1000};
    store.set('cur', st); location.hash = '#exam'; return;
  }
  const byId = Object.fromEntries(D.q.map(q=>[q.id,q]));
  function save(){ store.set('cur', st); }
  function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return m+':'+String(s).padStart(2,'0'); }
  function pause(){ st.rem = st.end-Date.now(); st.paused = true; save(); draw(); }
  function resume(){ st.end = Date.now()+st.rem; st.paused = false; delete st.rem; save(); draw(); }
  function draw(){
    if(st.paused){
      const n = Object.keys(st.ans).length;
      app.innerHTML = `<div class="card" style="text-align:center"><p class="muted">Exam paused</p><p class="big">${fmt(st.rem)}</p><p>remaining · ${n} of ${st.ids.length} answered</p><p class="muted">Questions are hidden while paused. Your exam is saved — you can close the browser and come back.</p><button class="btn" id="rs">▶ Resume exam</button></div>`;
      $('#rs').onclick = resume; return;
    }
    const q = byId[st.ids[st.i]], n = Object.keys(st.ans).length;
    app.innerHTML = `<div class="row"><span class="timer" id="tm">${fmt(st.end-Date.now())}</span><button class="btn sm ghost" id="ps">⏸ Pause</button><span class="grow muted">Q ${st.i+1} of ${st.ids.length} · ${n} answered</span><button class="btn sm ghost" id="fl">${st.flag[q.id]?'⚑ Flagged':'⚐ Flag'}</button></div>
     <div class="card" style="margin-top:10px"><div class="q">${esc(q.q)}</div>${q.o.map((o,k)=>`<button class="opt ${st.ans[q.id]===k?'sel':''}" data-k="${k}"><span class="l">${L[k]}</span>${esc(o)}</button>`).join('')}</div>
     <div class="row"><button class="btn ghost" id="pv" ${st.i?'':'disabled'}>‹ Prev</button><span class="grow"></span><button class="btn" id="nx">${st.i<st.ids.length-1?'Next ›':'Review & submit'}</button></div>
     <details style="margin-top:14px"><summary>Question map (answered = filled, flagged = orange)</summary><div class="qnav">${st.ids.map((id,j)=>`<button class="${st.ans[id]!==undefined?'a':''} ${st.flag[id]?'f':''} ${j===st.i?'cur':''}" data-j="${j}">${j+1}</button>`).join('')}</div></details>
     <div class="row" style="margin-top:14px"><button class="btn ghost sm" id="sb">Submit exam now</button><button class="btn ghost sm" id="qt">Quit (discard)</button></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[q.id]=+b.dataset.k;save();draw();});
    app.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{st.i=+b.dataset.j;save();draw();});
    $('#fl').onclick=()=>{st.flag[q.id]=!st.flag[q.id];save();draw();};
    $('#ps').onclick=pause;
    $('#pv').onclick=()=>{if(st.i){st.i--;save();draw();}};
    $('#nx').onclick=()=>{ if(st.i<st.ids.length-1){st.i++;save();draw();} else confirmSubmit(); };
    $('#sb').onclick=confirmSubmit;
    $('#qt').onclick=()=>{ if(confirm('Discard this exam?')){ store.set('cur',null); location.hash='#home'; } };
  }
  function confirmSubmit(){ const left = st.ids.length-Object.keys(st.ans).length, fl = Object.values(st.flag).filter(Boolean).length;
    if(confirm(`Submit exam? ${left} unanswered, ${fl} flagged.`)) finish(); }
  function finish(){
    clearInterval(timerId);
    const PIL = new Set(D.pilot);
    const scored = st.ids.filter(id=>!PIL.has(id));
    const per = {}; let c = 0;
    scored.forEach(id=>{ const q=byId[id]; per[q.d]=per[q.d]||{c:0,t:0}; per[q.d].t++; if(st.ans[id]===q.a){c++;per[q.d].c++;} });
    const pct = Math.round(c/scored.length*100);
    const exams = store.get('exams', []); exams.push({at:Date.now(), pct}); store.set('exams', exams);
    const m = store.get('missed', []); scored.forEach(id=>{ if(st.ans[id]!==byId[id].a && !m.includes(id)) m.push(id); }); store.set('missed', m);
    const fin = st; store.set('cur', null);
    app.innerHTML = `<div class="card" style="text-align:center"><p class="muted">Mock exam result</p><p class="big ${pct>=80?'pass':'fail'}">${pct}%</p><p>${c} of ${scored.length} scored questions correct. ${pct>=85?'At or above the 85% study target. Keep reviewing misses.':pct>=75?'Close. Aim for 85%+ before test day.':'Keep going — drill your weakest domains below, then retake.'}</p></div>
     <div class="card"><h3>Score by domain</h3>${D.blueprint.map(b=>{const s=per[b[0]]||{c:0,t:0};const p=s.t?Math.round(s.c/s.t*100):0;return `<div class="dom"><span class="tag">${b[0]}</span><div class="grow"><b>${b[1]}</b><div class="bar"><i style="width:${p}%"></i></div></div><b>${s.c}/${s.t}</b></div>`}).join('')}</div>
     <div class="card"><h3>Review answers</h3><label class="muted"><input type="checkbox" id="om" checked> show missed only</label><div id="rv"></div></div>
     <div class="row"><a class="btn" href="#drill/MISS">Drill my misses</a><a class="btn ghost" href="#exam">Exam home</a></div>`;
    const rv = () => { const only = $('#om').checked; $('#rv').innerHTML = fin.ids.map((id,j)=>{ const q=byId[id], a=fin.ans[id], ok=a===q.a, pl=PIL.has(id); if(only&&ok&&!pl) return '';
      return `<div style="border-top:1px solid var(--line);padding:12px 0"><div class="muted">Q${j+1} · ${q.d} · ${q.t} ${pl?'<b>pilot, not scored</b>':ok?'<span class="pass">✓</span>':'<span class="fail">✗</span>'}</div><div class="q" style="font-size:15.5px">${esc(q.q)}</div>
      ${q.o.map((o,k)=>`<div class="opt ${k===q.a?'right':k===a?'wrong':''}" style="cursor:default"><span class="l">${L[k]}</span>${esc(o)}</div>`).join('')}<div class="exp">${a===undefined?'<b>Not answered.</b> ':''}${esc(q.e)}</div></div>`}).join('') || '<p>No misses — great job!</p>'; };
    $('#om').onchange = rv; rv();
  }
  draw();
  timerId = setInterval(()=>{ if(st.paused) return; const left = st.end-Date.now(); const t=$('#tm'); if(t) t.textContent=fmt(left); if(left<=0){ alert('Time is up! Your exam will be submitted.'); finish(); } }, 1000);
}
function files(){ home(); }
route();
</script>
